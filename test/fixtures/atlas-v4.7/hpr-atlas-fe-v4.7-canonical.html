    #topbar{background:var(--chrome);border-bottom-color:color-mix(in srgb,var(--border) 76%,transparent);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 8%,transparent);backdrop-filter:blur(18px) saturate(1.25)}
    #mapFallback{background:var(--map-fallback);color:var(--text3)}
    #mapFallback::before{opacity:.5;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:64px 64px}
    #rail,#collectionPanel,#detailCard,#toolPanel{background-image:var(--panel-sheen);background-color:var(--surface);border-color:color-mix(in srgb,var(--border) 86%,transparent);backdrop-filter:blur(18px) saturate(1.2)}
    .icon-btn,.pill,.top-chip,.tool-action,.setting-row,.peer-btn,.topology-stat,.env-pill{background-color:var(--surface-2)}
    .maplibregl-ctrl-group{background:var(--control-bg)!important;border-color:var(--control-border)!important;backdrop-filter:blur(14px)}
    .maplibregl-ctrl-group button{background:var(--control-bg)!important}
    :root:not([data-theme="dark"]) .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:none}

    /* Theme-specific content cards: daylight is genuinely bright, not dark gray. */
    :root:not([data-theme="dark"]) .photo-frame.aircraft{background:radial-gradient(circle at 72% 20%,rgba(240,181,43,.22),transparent 30%),linear-gradient(145deg,#f7f2dd,#dfeef5 62%,#d4e2ec)}
    :root:not([data-theme="dark"]) .photo-frame.vessel{background:radial-gradient(ellipse at 50% 44%,rgba(8,127,91,.17),transparent 27%),repeating-linear-gradient(170deg,rgba(0,111,135,.09) 0 2px,transparent 2px 18px),linear-gradient(#dff0ef,#cfe4ea)}
    :root:not([data-theme="dark"]) .photo-frame.aton{background:radial-gradient(circle at 50% 42%,rgba(0,111,168,.16),transparent 26%),repeating-linear-gradient(170deg,rgba(0,111,168,.07) 0 2px,transparent 2px 19px),linear-gradient(#e8f5f4,#d8eaf1)}
    :root:not([data-theme="dark"]) .photo-frame.station{background:radial-gradient(circle,rgba(0,125,131,.16),transparent 34%),repeating-radial-gradient(circle,rgba(0,125,131,.09) 0 1px,transparent 1px 32px),linear-gradient(145deg,#e8f5ee,#d9ebed 68%)}
    :root:not([data-theme="dark"]) .photo-frame.airport,
    :root:not([data-theme="dark"]) .photo-frame.airline,
    :root:not([data-theme="dark"]) .photo-frame.flightRoute{background:radial-gradient(circle,rgba(107,75,181,.15),transparent 35%),linear-gradient(145deg,#f1ecfb,#e2eaf4 66%,#dbe5ef)}
    :root:not([data-theme="dark"]) .photo-frame.seaport,
    :root:not([data-theme="dark"]) .photo-frame.operator,
    :root:not([data-theme="dark"]) .photo-frame.seaLane{background:radial-gradient(circle,rgba(0,107,143,.14),transparent 35%),repeating-linear-gradient(170deg,rgba(0,107,143,.07) 0 2px,transparent 2px 20px),linear-gradient(#e1f1f3,#d4e8ed)}
    :root:not([data-theme="dark"]) .photo-frame::before{background-image:linear-gradient(rgba(20,70,80,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(20,70,80,.07) 1px,transparent 1px)}
    :root:not([data-theme="dark"]) .photo-asset{filter:drop-shadow(0 10px 12px rgba(44,80,84,.18))}
    :root[data-theme="dark"] .photo-frame.aircraft{background:radial-gradient(circle at 72% 20%,rgba(241,202,88,.18),transparent 30%),linear-gradient(145deg,#172b43,#08131f 64%,#03070c)}
    :root[data-theme="dark"] .photo-frame.vessel{background:radial-gradient(ellipse at 50% 45%,rgba(79,211,155,.18),transparent 26%),repeating-linear-gradient(170deg,rgba(85,201,255,.10) 0 2px,transparent 2px 18px),linear-gradient(#123044,#05111a)}
    :root[data-theme="dark"] .photo-frame.aton{background:radial-gradient(circle at 50% 42%,rgba(99,199,255,.19),transparent 25%),repeating-linear-gradient(170deg,rgba(99,199,255,.07) 0 2px,transparent 2px 19px),linear-gradient(#102c43,#05101a)}
    :root[data-theme="dark"] .photo-frame.station{background:radial-gradient(circle,rgba(66,228,208,.17),transparent 34%),repeating-radial-gradient(circle,rgba(66,228,208,.10) 0 1px,transparent 1px 32px),linear-gradient(145deg,#0b2730,#040e16 68%)}

    /* Adaptive chrome is deliberately separate from the desktop rail. */
    #tabletDock,#mobileContextBar,#mobileEntityPicker,#mobileToolsMenu,#adaptiveScrim,#mobilePeekBar{display:none}
    #tabletDock{pointer-events:auto;position:absolute;z-index:34;align-items:center;gap:8px;padding:7px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--e2);backdrop-filter:blur(18px) saturate(1.2)}
    .td-group{display:flex;align-items:center;gap:4px}.td-divider{width:1px;height:30px;background:var(--border);margin:0 2px}
    .td-entity,.td-tool{height:38px;border:0;border-radius:10px;color:var(--text2);background:transparent;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700}
    .td-entity{min-width:82px;padding:0 10px}.td-entity i{width:7px;height:7px;border-radius:50%;background:var(--kind-color);box-shadow:0 0 9px color-mix(in srgb,var(--kind-color) 55%,transparent)}.td-entity small{color:var(--text3);font-size:8px;font-weight:700}.td-entity.on{color:var(--text);background:color-mix(in srgb,var(--kind-color) 12%,var(--surface-2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--kind-color) 28%,transparent)}
    .td-tool{width:38px}.td-tool svg{width:18px;height:18px}.td-tool:hover,.td-tool.on{color:var(--accent);background:var(--surface-2)}

    #mobileContextBar{pointer-events:auto;position:absolute;z-index:34;align-items:center;gap:7px}
    .mobile-context-btn,.mobile-square-btn{height:44px;border:1px solid color-mix(in srgb,var(--border) 85%,transparent);background:var(--surface);box-shadow:var(--e1);backdrop-filter:blur(18px) saturate(1.2);color:var(--text)}
    .mobile-context-btn{min-width:0;flex:1;display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:14px;text-align:left}.mobile-context-btn .mc-dot{width:8px;height:8px;border-radius:50%;background:var(--kind-color);box-shadow:0 0 10px color-mix(in srgb,var(--kind-color) 58%,transparent)}.mobile-context-btn .mc-copy{min-width:0;flex:1}.mobile-context-btn strong{display:block;font-size:13px;line-height:1.05}.mobile-context-btn small{display:block;margin-top:3px;color:var(--text3);font-size:9px}.mobile-context-btn svg{width:15px;height:15px;color:var(--text3)}
    .mobile-square-btn{width:44px;display:grid;place-items:center;padding:0;border-radius:14px}.mobile-square-btn svg{width:18px;height:18px}.mobile-square-btn:active{transform:translateY(1px)}
    #adaptiveScrim{pointer-events:none;position:absolute;z-index:35;inset:0;background:rgba(2,10,17,.18);backdrop-filter:blur(1px);opacity:0;transition:opacity .15s}.adaptive-menu-open #adaptiveScrim{display:block;pointer-events:auto;opacity:1}
    #mobileEntityPicker,#mobileToolsMenu{pointer-events:auto;position:absolute;z-index:40;padding:8px;border:1px solid var(--border);border-radius:18px;background:var(--surface-solid);box-shadow:var(--e2)}
    #mobileEntityPicker.open,#mobileToolsMenu.open{display:block}
    .mobile-picker-title{padding:7px 9px 8px;color:var(--text3);font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
    .mobile-picker-item{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:11px;background:transparent;color:var(--text);text-align:left}.mobile-picker-item:hover,.mobile-picker-item.on{background:var(--surface-2)}.mobile-picker-item i{width:8px;height:8px;border-radius:50%;background:var(--kind-color)}.mobile-picker-item span{flex:1;font-size:12px;font-weight:700}.mobile-picker-item small{color:var(--text3);font-size:9px}.mobile-picker-item svg{width:17px;height:17px;color:var(--text2)}
    #mobilePeekBar{pointer-events:auto;position:absolute;z-index:28;align-items:center;gap:10px;height:46px;padding:0 13px;border:1px solid var(--border);border-radius:15px;background:var(--surface);box-shadow:var(--e2);backdrop-filter:blur(18px) saturate(1.2);color:var(--text);text-align:left;transition:opacity .16s,transform .16s}.mobile-peek-dot{width:8px;height:8px;border-radius:50%;background:var(--kind-color)}#mobilePeekBar b{font-size:12px}#mobilePeekBar small{flex:1;color:var(--text3);font-size:9px}#mobilePeekBar svg{width:16px;height:16px;color:var(--text3)}
    body.sheet-open #mobilePeekBar{opacity:0;pointer-events:none;transform:translateY(12px)}

    .theme-profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}.theme-profile{position:relative;min-height:72px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text);text-align:left;overflow:hidden}.theme-profile::before{content:"";position:absolute;inset:0;background:var(--profile-bg);opacity:.9}.theme-profile>*{position:relative}.theme-profile b{display:block;font-size:11px}.theme-profile small{display:block;margin-top:3px;color:var(--text3);font-size:8px}.theme-profile i{display:block;width:24px;height:3px;margin-top:12px;border-radius:3px;background:var(--profile-accent)}.theme-profile.on{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}.theme-profile.day{--profile-bg:linear-gradient(135deg,#fff8df,#dff2f1);--profile-accent:#006f87}.theme-profile.night{--profile-bg:linear-gradient(135deg,#061422,#10283b);--profile-accent:#59ddff}.theme-profile.night b{color:#f3f8ff}.theme-profile.night small{color:#9eb5c9}

    /* Tablet: dedicated command dock, one working side panel at a time on portrait. */
    @media (min-width:768px) and (max-width:1279px){
      :root{--topbar-h:56px;--panel-w:350px;--list-w:326px;--right-panel-offset:12px}
      #topbar{height:var(--topbar-h);padding-inline:12px}.brand{height:36px}.build-tag{display:inline-block}.top-search{flex:1 1 260px;max-width:360px}.top-search input{height:36px}.top-search>svg{top:10px}#topChips{display:none}.top-fixed .secondary-pill{display:none}.top-fixed .pill{height:34px}
      #rail{display:none!important}#tabletDock{display:flex;top:12px;left:12px}
      #collectionPanel{top:66px;left:12px;width:min(326px,38vw);max-height:calc(100vh - var(--topbar-h) - 82px);border-radius:16px}
      #detailCard{top:66px;right:12px;width:min(356px,40vw);max-height:calc(100vh - var(--topbar-h) - 82px);border-radius:16px}
      #toolPanel{top:66px;left:12px;width:min(340px,42vw);max-height:calc(100vh - var(--topbar-h) - 82px);border-radius:16px}
      .maplibregl-ctrl-top-right{top:66px!important;right:12px!important}.maplibregl-ctrl-bottom-right{right:12px!important}
      #coordDisplay{bottom:12px;right:12px}#networkModeBadge{right:12px;bottom:44px}
      .photo-frame{aspect-ratio:16/10}.sc-photo{padding:12px 14px 0}
    }
    @media (min-width:768px) and (max-width:980px){
      #tabletDock{right:12px;overflow-x:auto;scrollbar-width:none}.td-entity{min-width:72px;padding-inline:8px}.td-entity small{display:none}.td-tool{width:36px}
      #detailCard{width:360px;max-width:calc(100vw - 24px)}#collectionPanel{width:340px;max-width:calc(100vw - 24px)}
    }

    /* Mobile: map-first product. No compressed desktop rail, no permanent bottom nav. */
    @media (max-width:767px){
      :root{--topbar-h:52px;--map-edge:10px}
      #topbar{height:var(--topbar-h);padding:0 10px;gap:8px}.brand{height:36px;gap:6px}.brand svg{width:19px;height:19px}.brand>span:first-of-type{display:none}.brand-product{display:inline!important;font-size:15px}.build-tag{display:none}.top-fixed{margin-left:auto}.top-fixed .pill{display:none}.icon-btn{width:36px;height:36px;border-radius:12px}.icon-btn svg{width:17px;height:17px}#topChips{display:none}
      .top-search{display:none;position:fixed;z-index:98;top:58px;left:10px;right:10px;max-width:none;min-width:0;padding:8px;border:1px solid var(--border);border-radius:16px;background:var(--surface-solid);box-shadow:var(--e2)}.top-search.mobile-open{display:block}.top-search input{height:42px;padding-left:12px;border-radius:11px}.top-search>svg{top:21px;right:20px}#searchResults{top:112px!important;left:10px!important;right:10px!important;width:auto!important;max-height:48vh;border-radius:14px}
      #rail,#tabletDock{display:none!important}#mobileContextBar{display:flex;top:10px;left:10px;right:10px}#mobilePeekBar{display:flex;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
      #mobileEntityPicker{top:62px;left:10px;width:min(300px,calc(100vw - 20px))}#mobileToolsMenu{top:62px;right:10px;width:210px}
      #collectionPanel,#detailCard,#toolPanel{left:8px;right:8px;top:auto;width:auto;border-radius:22px;box-shadow:0 22px 64px rgba(0,0,0,.34);backdrop-filter:blur(22px) saturate(1.25)}
      #collectionPanel:not(.open),#detailCard:not(.open),#toolPanel:not(.open){visibility:hidden}
      #collectionPanel{bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:52vh;transform:translateY(calc(100% + 80px));opacity:1}#collectionPanel.open{transform:translateY(0);opacity:1}
      body.drawer-open #collectionPanel{transform:translateY(calc(100% + 80px));opacity:1;pointer-events:none}
      #detailCard{bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:56vh;transform:translateY(calc(100% + 80px));opacity:1}#detailCard.open{transform:translateY(0);opacity:1}
      #toolPanel{bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:61vh;transform:translateY(calc(100% + 80px));opacity:1}#toolPanel.open{transform:translateY(0);opacity:1}
      #collectionPanel::before,#detailCard::before,#toolPanel::before{content:"";position:absolute;z-index:3;top:7px;left:50%;width:42px;height:4px;transform:translateX(-50%);border-radius:4px;background:color-mix(in srgb,var(--text3) 42%,transparent)}
      .list-head,.sc-head,.tool-head{padding-top:8px;min-height:50px}.list-head{padding-left:14px}.sc-head{padding-left:14px}.tool-head{padding-left:14px}
      #listTabs{padding-inline:6px}.list-tab{padding:9px 11px;font-size:9px}.entity-row{min-height:60px;padding:8px 12px}.station-row{min-height:72px}
      .sc-photo{display:none}.sc-motion{grid-template-columns:repeat(3,1fr)}.metric-value{font-size:16px}.sc-id{padding-block:9px}.sc-section{padding:10px 14px}.sc-actions{padding:9px 10px calc(9px + env(safe-area-inset-bottom,0px))}.sc-actions .action-btn{min-height:38px}
      .peer-grid{grid-template-columns:1fr 1fr}.topology-summary{gap:5px}.topology-stat{padding:6px 4px}
      .maplibregl-ctrl-top-right{top:64px!important;right:10px!important}.maplibregl-ctrl-bottom-right{right:10px!important;bottom:64px!important}.maplibregl-ctrl-bottom-left{bottom:64px!important}
      #coordDisplay{display:none}#networkModeBadge{right:10px;bottom:68px;max-width:calc(100vw - 20px)}#scope{max-width:72vw;max-height:72vw}
      .preview-card{width:calc(100vw - 20px);max-height:calc(100vh - 20px);border-radius:20px}.preview-hero{height:150px}
    }
    @media (max-width:390px){.mobile-context-btn{padding-inline:10px}.mobile-square-btn{width:42px;height:42px}.mobile-context-btn{height:42px}.mobile-context-btn small{font-size:8px}.mobile-context-btn strong{font-size:12px}}
    @media (max-height:620px) and (max-width:767px){#collectionPanel,#detailCard,#toolPanel{max-height:68vh}.mobile-context-btn,.mobile-square-btn{height:40px}.maplibregl-ctrl-top-right{top:58px!important}}

  </style>
</head>
<body>
  <div id="mapFallback"><span>Loading HPR map surface…</span></div>
  <div id="map" aria-label="Atlas tracking map"></div>
  <div id="weatherOverlay"></div>

  <div id="shell">
    <header id="topbar">
      <div class="brand" aria-label="HPRadar Atlas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/><path d="M12 12 18.5 7.5M12 3.5v2M20.5 12h-2M12 20.5v-2M3.5 12h2"/></svg>
        <span>HPRadar</span><span class="brand-product">Atlas</span><span class="build-tag">FE V4.7</span>
      </div>
      <div class="top-search">
        <input id="globalSearch" autocomplete="off" placeholder="Search objects, stations, places…" aria-label="Search Atlas" role="combobox" aria-autocomplete="list" aria-controls="searchResults" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <div id="searchResults" role="listbox" aria-label="Atlas search results"></div>
      </div>
      <div id="topChips" aria-label="Atlas overview" aria-live="polite">
        <div class="chip-track"><div class="chip-run"></div></div>
      </div>
      <div class="top-fixed">
        <span class="pill secondary-pill"><strong class="num">143</strong> tracked</span>
        <span class="pill"><span class="status-dot"></span><span class="num">4,210</span> msg/s</span>
        <button class="icon-btn" id="themeToggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme"></button>
      </div>
    </header>

    <main id="viewMap">

      <!-- FE V4.7 adaptive composition chrome: tablet and mobile do not reuse the desktop rail. -->
      <nav id="tabletDock" aria-label="Tablet Atlas command dock">
        <div class="td-group" aria-label="Operational entities">
          <button class="td-entity" data-tablet-kind="aircraft" style="--kind-color:var(--air)"><i></i><span>Aircraft</span><small data-kind-count="aircraft"></small></button>
          <button class="td-entity" data-tablet-kind="vessel" style="--kind-color:var(--sea)"><i></i><span>Vessels</span><small data-kind-count="vessel"></small></button>
          <button class="td-entity" data-tablet-kind="aton" style="--kind-color:var(--aton)"><i></i><span>AtoN</span><small data-kind-count="aton"></small></button>
          <button class="td-entity" data-tablet-kind="station" style="--kind-color:var(--station)"><i></i><span>Stations</span><small data-kind-count="station"></small></button>
        </div>
        <div class="td-divider"></div>
        <div class="td-group" aria-label="Map tools">
          <button class="td-tool" data-tablet-tool="layers" title="Layers" aria-label="Layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></button>
          <button class="td-tool" data-tablet-tool="weather" title="Environment" aria-label="Environment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/><path d="M7 19h2m4 0h2"/></svg></button>
          <button class="td-tool" data-tablet-tool="map" title="Map" aria-label="Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></button>
          <button class="td-tool" data-tablet-tool="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 1-.1 1.2l2 1.5-2 3.5-2.5-1a8 8 0 0 1-2 1.2L14 21h-4l-.4-2.6a8 8 0 0 1-2-1.2l-2.5 1-2-3.5 2-1.5A7 7 0 0 1 5 12c0-.4 0-.8.1-1.2l-2-1.5 2-3.5 2.5 1a8 8 0 0 1 2-1.2L10 3h4l.4 2.6a8 8 0 0 1 2 1.2l2.5-1 2 3.5-2 1.5c.1.4.1.8.1 1.2Z"/></svg></button>
        </div>
      </nav>

      <div id="mobileContextBar" aria-label="Mobile Atlas context">
        <button class="mobile-context-btn" id="mobileEntityButton" style="--kind-color:var(--sea)" aria-haspopup="dialog" aria-expanded="false"><span class="mc-dot"></span><span class="mc-copy"><strong id="mobileEntityLabel">Vessels</strong><small id="mobileEntityCount">Map context</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 10 5 5 5-5"/></svg></button>
        <button class="mobile-square-btn" id="mobileSearchButton" title="Search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button class="mobile-square-btn" id="mobileLayersButton" title="Layers" aria-label="Layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></button>
        <button class="mobile-square-btn" id="mobileMoreButton" title="More" aria-label="More tools" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
      </div>
      <div id="adaptiveScrim" aria-hidden="true"></div>
      <div id="mobileEntityPicker" role="dialog" aria-label="Choose entity class">
        <div class="mobile-picker-title">Operational entities</div>
        <button class="mobile-picker-item" data-mobile-kind="aircraft" style="--kind-color:var(--air)"><i></i><span>Aircraft</span><small data-kind-count="aircraft"></small></button>
        <button class="mobile-picker-item" data-mobile-kind="vessel" style="--kind-color:var(--sea)"><i></i><span>Vessels</span><small data-kind-count="vessel"></small></button>
        <button class="mobile-picker-item" data-mobile-kind="aton" style="--kind-color:var(--aton)"><i></i><span>AtoN</span><small data-kind-count="aton"></small></button>
        <button class="mobile-picker-item" data-mobile-kind="station" style="--kind-color:var(--station)"><i></i><span>Stations</span><small data-kind-count="station"></small></button>
      </div>

    function syncQaState(){const out=$('#qaState');if(!out)return;const d=state.selected,p=map&&d?.coord?map.project(d.coord):null;out.textContent=JSON.stringify({version:'4.7',ontology:['aircraft','vessel','aton','station'],state:{kind:state.kind,selectedId:d?.id||null,collectionOpen:state.collectionOpen,tool:state.tool,follow:state.follow,trailFocus:state.trailFocus,stationFocus:state.observedSource,mlatFocus:state.mlatFocus,theme:state.theme,units:state.units,labelDensity:state.labelDensity,mapStyle:state.mapStyle,projection:state.projection,activeArea:state.activeArea,layers:state.layers},camera:map?{center:map.getCenter().toArray(),zoom:map.getZoom(),bearing:map.getBearing(),pitch:map.getPitch(),projection:map.getProjection?.().type||'mercator'}:null,selectedScreen:p?{x:p.x,y:p.y}:null})}

    function renderTool(name){
      state.tool=name;state.headerContext=name;state.collectionOpen=false;$('#collectionPanel').classList.remove('open');$('#collectionPanel').inert=true;if(innerWidth<768&&state.selected){state.selected=null;state.follow=false;state.observedSource=null;state.mlatFocus=null;renderDetail();updateOperationalSources()}$('#toolPanel').classList.add('open');$('#toolPanel').inert=false;$('#toolTitle').textContent=name==='weather'?'Environment':name[0].toUpperCase()+name.slice(1);$$('.rail-btn').forEach(b=>{const on=b.dataset.tool===name;b.classList.toggle('on',on);if(b.dataset.tool)b.setAttribute('aria-expanded',String(on))});renderHeaderContext();syncAdaptiveChrome();settleMapLayout(!!state.selected);
      let html='';const layerRow=(key,label,meta='')=>`<label class="setting-row"><span class="layer-copy"><span>${label}</span>${meta?`<small>${meta}</small>`:''}</span><span class="switch"><input type="checkbox" data-layer="${key}" ${state.layers[key]?'checked':''}><span class="switch-track"></span></span></label>`;

      if(name==='weather')html=`<div class="traffic-api-card"><div class="traffic-api-head"><b>AtoN environmental sensing</b><span>Observation layer</span></div><div class="api-domain"><b>Meteo</b><span>Wind speed + direction from fixed AIS AtoN stations</span></div><div class="api-domain"><b>Hydro</b><span>Water level + tide intelligence; entity remains AtoN</span></div></div>${layerRow('wind','Wind vectors','live observations')}${layerRow('waterLevel','Water level','live observations')}${layerRow('tide','Tide surface','prediction demo')}<div class="tool-note"><b>Weather is not a fifth entity class.</b> It is an observation overlay attached to fixed AtoN / sensor-capable infrastructure.</div>`;

      if(name==='areas')html=`<div class="tool-grid"><button class="tool-action area ${state.activeArea==='Hải Phòng'?'on':''}" data-name="Hải Phòng" data-area="106.72,20.82,9">Hải Phòng</button><button class="tool-action area ${state.activeArea==='Hạ Long'?'on':''}" data-name="Hạ Long" data-area="107.10,20.91,9">Hạ Long Bay</button><button class="tool-action area ${state.activeArea==='Vietnam'?'on':''}" data-name="Vietnam" data-area="108.10,16.2,5.4">Vietnam</button><button class="tool-action area ${state.activeArea==='ASEAN'?'on':''}" data-name="ASEAN" data-area="106.8,12.0,3.8">ASEAN</button></div>`;
      if(name==='settings')html=`<div class="tool-section-title">Theme profile</div><div class="theme-profile-grid"><button class="theme-profile day ${state.theme==='light'?'on':''}" data-theme-profile="light"><b>Daylight</b><small>Warm white · marine cyan · high contrast</small><i></i></button><button class="theme-profile night ${state.theme==='dark'?'on':''}" data-theme-profile="dark"><b>Night Ops</b><small>Deep navy · luminous cyan · low glare</small><i></i></button></div><div class="tool-section-title">Atlas</div><label class="setting-row"><span>Units</span><select class="select" data-setting="units"><option value="nautical" ${state.units==='nautical'?'selected':''}>Nautical</option><option value="metric" ${state.units==='metric'?'selected':''}>Metric</option></select></label><label class="setting-row"><span>Label density</span><select class="select" data-setting="labelDensity"><option value="operational" ${state.labelDensity==='operational'?'selected':''}>Operational</option><option value="minimal" ${state.labelDensity==='minimal'?'selected':''}>Minimal</option><option value="dense" ${state.labelDensity==='dense'?'selected':''}>Dense</option></select></label><div class="tool-section-title">Composition</div><div class="tool-note"><b>Adaptive UI</b><br><code>Desktop rail · Tablet command dock<br>Mobile map-first + contextual sheets</code></div><div class="tool-section-title">About</div><div class="tool-note"><b>HPRadar Atlas FE V4.7</b><br><code>4-class ontology + MLAT topology<br>Zero application contract calls</code></div>`;
      $('#toolBody').innerHTML=html;$$('#toolBody [data-theme-profile]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.themeProfile);renderTool('settings');syncAdaptiveChrome()});$$('#toolBody [data-layer]').forEach(x=>x.onchange=()=>{state.layers[x.dataset.layer]=x.checked;if(x.dataset.layer==='mlatTopology'&&!x.checked)state.mlatFocus=null;applyLayerVisibility();persistPreferences();renderHeaderContext()});$$('#toolBody [data-setting]').forEach(x=>x.onchange=()=>{state[x.dataset.setting]=x.value;if(x.dataset.setting==='labelDensity')applyLayerVisibility();renderList();renderDetail();renderHeaderContext();persistPreferences()});$$('#toolBody [data-basemap]').forEach(b=>b.onclick=()=>{setBasemap(b.dataset.basemap);$$('#toolBody [data-basemap]').forEach(x=>x.classList.toggle('on',x===b))});$$('#toolBody .area').forEach(b=>b.onclick=()=>{const [lon,lat,z]=b.dataset.area.split(',').map(Number);state.activeArea=b.dataset.name;map?.flyTo({center:[lon,lat],zoom:z,bearing:0,pitch:0,offset:cameraOffset(),duration:500});renderHeaderContext()});$('#resetMap')?.addEventListener('click',()=>{state.activeArea='Hải Phòng';map?.flyTo({center:[106.82,20.79],zoom:7.1,bearing:-7,pitch:0,duration:500})});
    }

    function openCollection(kind,scope=null){const switching=state.selected&&OPERATIONAL_KINDS.has(state.selected.kind)&&state.selected.kind!==kind;if(switching){state.selected=null;state.follow=false;state.trailFocus=null;state.observedSource=null;renderDetail()}state.kind=kind;state.collectionScope=scope;state.collectionOpen=true;resetToolUi();state.headerContext=kind;state.layers.mlatTopology=kind==='station';state.mlatFocus=null;if(innerWidth<1180&&state.selected){state.selected=null;state.follow=false;state.observedSource=null;renderDetail();updateOperationalSources()}$('#collectionPanel').classList.add('open');$('#collectionPanel').inert=false;renderList();renderHeaderContext();applyLayerVisibility();syncAdaptiveChrome();settleMapLayout(!!state.selected)}
    function selectEntity(id,focus){const d=entityById(id);if(!d)return;state.selected=d;if(OPERATIONAL_KINDS.has(d.kind)){if(d.kind!==state.kind)state.collectionScope=null;state.kind=d.kind;state.headerContext=d.kind}resetToolUi();state.follow=false;state.trailFocus=null;state.observedSource=null;if(d.kind==='station'&&d.capabilities?.includes('MLAT')){state.layers.mlatTopology=true;state.mlatFocus=d.id}else if(d.kind!=='station'){state.mlatFocus=null;state.layers.mlatTopology=false;}if(d.kind==='airport')state.layers.airports=true;if(d.kind==='seaport')state.layers.seaports=true;if(innerWidth<1180)closeCollection(false);else{state.collectionOpen=true;$('#collectionPanel').classList.add('open')}renderList();renderHeaderContext();renderDetail();updateOperationalSources();syncAdaptiveChrome();if(focus)settleMapLayout(true)}

    function insightLines(d,mode){if(mode==='media')return [['Atlas visual',`${d.type} rendered from local canonical/demo assets.`],['Stable identity',displayCode(d)],['Map context',d.coord?`${d.coord[1].toFixed(4)}, ${d.coord[0].toFixed(4)}`:'Registry entity']];if(d.kind==='aton')return [['Ontology','Fixed navigation entity; never treated as a vessel track.'],['Telemetry',`${d.method} · ${d.age} · Q${d.quality}`],['Environment',d.sensors?.length?`Wind ${d.windSpeed.toFixed(1)} m/s · water ${d.waterLevel.toFixed(2)} m`:'No environmental payload in this demo.']];if(d.kind==='station')return [['Ontology','Fixed sensor site with protocol-specific receiver positions.'],['Capabilities',d.capabilities.join(' + ')],['MLAT',d.capabilities.includes('MLAT')?`${d.activePeers}/${d.peerCount} active peers · ${d.mlatGeometry} geometry`:'Not an MLAT node.']];if(d.kind==='aircraft')return [['Flight state',`${altitudeText(d.altitude)} · ${speedText(d.speed)}`],['Observation',`${d.method} via ${d.source} · Q${d.quality}`],['Mobility','MOVING target']];if(d.kind==='vessel')return [['Voyage state',`${speedText(d.speed)} · ${d.destination}`],['Observation',`${d.method} via ${d.source} · Q${d.quality}`],['Mobility','MOVING target']];return [['Atlas context',d.type],['Identity',displayCode(d)],['Status',d.status]]}



    // FE V4.7 adaptive composition controller. State/renderers remain shared.
    const V47_LABELS={aircraft:'Aircraft',vessel:'Vessels',aton:'AtoN',station:'Stations'};
    const V47_COLOR={aircraft:'var(--air)',vessel:'var(--sea)',aton:'var(--aton)',station:'var(--station)'};
    function compositionMode(){return innerWidth<768?'mobile':innerWidth<1280?'tablet':'desktop'}
    function countKind(kind){return DATA.filter(d=>d.kind===kind).length}
    function syncAdaptiveChrome(){
      const mode=compositionMode();document.body.dataset.composition=mode;
      const kind=V47_LABELS[state.kind]?state.kind:'vessel',label=V47_LABELS[kind],count=countKind(kind);
      const mb=$('#mobileEntityButton'),peek=$('#mobilePeekBar');
      if(mb){mb.style.setProperty('--kind-color',V47_COLOR[kind]);$('#mobileEntityLabel').textContent=label;$('#mobileEntityCount').textContent=`${count.toLocaleString()} entities · map context`;}
      if(peek){peek.style.setProperty('--kind-color',V47_COLOR[kind]);$('#mobilePeekLabel').textContent=label;$('#mobilePeekCount').textContent=`${count.toLocaleString()} available · open list`;}
      $$('[data-kind-count]').forEach(el=>{el.textContent=countKind(el.dataset.kindCount).toLocaleString()});
      $$('[data-tablet-kind]').forEach(b=>b.classList.toggle('on',b.dataset.tabletKind===kind));
      $$('[data-mobile-kind]').forEach(b=>b.classList.toggle('on',b.dataset.mobileKind===kind));
      $$('[data-tablet-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tabletTool===state.tool));
      document.body.classList.toggle('sheet-open',mode==='mobile'&&(state.collectionOpen||!!state.selected||!!state.tool));

      $('#collectionPanel').classList.remove('open');$('#collectionPanel').inert=true;$('#detailCard').classList.remove('open');$('#detailCard').inert=true;resetToolUi();renderList();renderDetail();renderHeaderContext();applyLayerVisibility();closeAdaptiveMenus();syncAdaptiveChrome();settleMapLayout(false)

      else if(innerWidth<1180){state.selected=null;state.collectionOpen=true;$('#collectionPanel').classList.add('open');$('#collectionPanel').inert=false;$('#detailCard').classList.remove('open');$('#detailCard').inert=true;}

    $$('[data-tablet-kind]').forEach(b=>b.addEventListener('click',()=>openCollection(b.dataset.tabletKind)));
    $$('[data-tablet-tool]').forEach(b=>b.addEventListener('click',()=>state.tool===b.dataset.tabletTool?closeTool():renderTool(b.dataset.tabletTool)));

    $('#adaptiveScrim')?.addEventListener('click',closeAdaptiveMenus);
    $('#mobilePeekBar')?.addEventListener('click',()=>openCollection(state.kind));
    $('#mobileLayersButton')?.addEventListener('click',()=>renderTool('layers'));
    $('#mobileSearchButton')?.addEventListener('click',()=>{closeAdaptiveMenus();const box=$('.top-search');box.classList.toggle('mobile-open');if(box.classList.contains('mobile-open'))setTimeout(()=>$('#globalSearch').focus(),0);else setSearchOpen(false)});

    $$('.rail-btn[data-kind]').forEach(b=>b.onclick=()=>openCollection(b.dataset.kind));$$('.rail-btn[data-tool]').forEach(b=>b.onclick=()=>state.tool===b.dataset.tool?closeTool():renderTool(b.dataset.tool));$('#topChips').addEventListener('click',e=>{const chip=e.target.closest('[data-open-kind]');if(chip&&!chip.closest('[aria-hidden="true"]'))openCollection(chip.dataset.openKind)});
    $('#closeCollection').onclick=closeCollection;$('#closeDetail').onclick=()=>{state.selected=null;state.follow=false;state.trailFocus=null;state.observedSource=null;state.mlatFocus=null;renderDetail();updateOperationalSources();renderTopologyOverlay();syncAdaptiveChrome();settleMapLayout(false)};$('#closeTool').onclick=closeTool;$('#aiButton').onclick=()=>state.selected&&openPreview(state.selected,'ai');$('#themeToggle').onclick=()=>setTheme(state.theme==='dark'?'light':'dark');$('#closePreview').onclick=closePreview;$('#previewModal').addEventListener('click',e=>{if(e.target===$('#previewModal'))closePreview()});$('#previewModal').addEventListener('keydown',trapPreviewFocus);
    $('#globalSearch').addEventListener('input',search);$('#globalSearch').addEventListener('focus',()=>{if($('#globalSearch').value)search()});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();moveSearchCursor(1)}else if(e.key==='ArrowUp'){e.preventDefault();moveSearchCursor(-1)}else if(e.key==='Enter'){const results=$$('#searchResults [data-id]');if(results.length){e.preventDefault();results[searchCursor<0?0:searchCursor].click()}}else if(e.key==='Escape'){setSearchOpen(false);e.stopPropagation()}});document.addEventListener('click',e=>{if(!e.target.closest('.top-search'))setSearchOpen(false)});window.addEventListener('resize',()=>{positionSearchResults();updateScope();syncHeaderTicker();closeAdaptiveMenus();syncAdaptiveChrome();settleMapLayout(false)});document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(document.fullscreenElement)return;if($('#previewModal').classList.contains('open')){closePreview();return}if($('#searchResults').classList.contains('open')){setSearchOpen(false);return}if(state.tool)closeTool();else if(state.selected){state.selected=null;state.follow=false;state.trailFocus=null;state.observedSource=null;renderDetail();updateOperationalSources()}else if(state.collectionOpen)closeCollection()});
    if(window.ResizeObserver)new ResizeObserver(syncHeaderTicker).observe($('#topChips'));document.fonts?.ready?.then(syncHeaderTicker);

    restorePreferences();prepareInitialComposition();setTheme(state.theme);renderHeaderContext();renderList();renderDetail();syncAdaptiveChrome();initMap();
  </script>
