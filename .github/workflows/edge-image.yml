name: HPR Edge image

on:
  push:
    branches:
      - dev
      - feat/edge-atlas-v4.7-g3-g6
      - feat/edge-atlas-v4.7-production-parity
    tags:
      - "edge-v*"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: hpr-edge-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hpr-readsb-edge

jobs:
  build:
    name: Build arm64 + armv7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Atlas Edge FE gates G1-G6 readiness
        run: |
          bash test/edge-ui-g1.sh
          node test/edge-ui-g2.mjs
          node test/aircraft-renderer.test.mjs
          node test/airwire-adapter.test.mjs
          node test/station-context.test.mjs
          node test/edge-g6-capacity.test.mjs
          node test/edge-live-backend-contract.test.mjs
          sh -n hpr/edge/entrypoint.sh
          grep -q 'backend-status.json' hpr/edge/entrypoint.sh
          grep -q "nginx -g 'daemon off;'" hpr/edge/entrypoint.sh
          grep -q 'startup diagnostics' hpr/edge/ui/index.html
          grep -q 'hpr-edge-live-error' hpr/edge/ui/index.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=edge-g6,enable=${{ github.ref == 'refs/heads/feat/edge-atlas-v4.7-g3-g6' }}
            type=raw,value=edge-v47-parity,enable=${{ github.ref == 'refs/heads/feat/edge-atlas-v4.7-production-parity' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=edge-
          labels: |
            org.opencontainers.image.title=HPRadar readsb Edge
            org.opencontainers.image.description=HPR readsb + live AirWire + canonical Atlas V4.7 Edge UI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/edge.Dockerfile
          platforms: linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runtime backend-failure diagnostics smoke
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/edge-atlas-v4.7-production-parity'
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:edge-v47-parity"
          docker pull --platform linux/arm64 "$image"
          cid=$(docker run -d --platform linux/arm64 -e ADSB_SDR_SERIAL=__hpr_ci_missing_sdr__ -p 18080:80 "$image")
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/ > /tmp/edge-index.html; then ok=1; break; fi
            sleep 1
          done
          test "$ok" -eq 1
          grep -q 'startup diagnostics' /tmp/edge-index.html
          test "$(docker inspect --format '{{.State.Running}}' "$cid")" = true

          for asset in \
            airwire-adapter.js \
            aircraft-renderer.js \
            station-context.js \
            atlas-edge-hardening.js \
            atlas-edge-live-bridge.js
          do
            curl -fsS "http://127.0.0.1:18080/$asset" > /dev/null
          done
          curl -fsS http://127.0.0.1:18080/atlas-v4.7-shell.html > /dev/null

          status=$(curl -fsS http://127.0.0.1:18080/api/readsb/backend-status.json || true)
          pid=$(printf '%s' "$status" | sed -n 's/.*"pid":\([0-9][0-9]*\).*/\1/p')
          if [ -n "$pid" ] && printf '%s' "$status" | grep -q '"state":"running"'; then
            docker exec "$cid" sh -c "kill $pid" || true
          fi

          backend_error=0
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:18080/api/air/v1 2>/dev/null || true)
            if printf '%s' "$body" | grep -q '"error":"readsb exited"'; then backend_error=1; break; fi
            sleep 1
          done
          test "$backend_error" -eq 1
          test "$(docker inspect --format '{{.State.Running}}' "$cid")" = true
          curl -fsS http://127.0.0.1:18080/ | grep -q 'startup diagnostics'
