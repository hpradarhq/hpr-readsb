name: HPR Edge image

on:
  push:
    branches:
      - dev
      - "feat/edge-airwire-bin-*"
      - feat/edge-atlas-v4.7-native-airwire-v2
      - feat/edge-e1-e7-ux
    tags:
      - "edge-v*"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hpr-readsb-edge

jobs:
  test:
    name: AirWire + Edge FE tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libzstd-dev jq busybox

      - name: Edge FE syntax
        run: |
          node --check hpr/edge/ui/airwire-adapter.js
          node --check hpr/edge/ui/hpr-config.js
          for f in hpr/edge/ui/edge-g*.js test/edge_*.spec.js; do node --check "$f"; done

      - name: FE static gates
        run: |
          sh test/edge_static_gates.sh
          for f in test/edge_g*_gate.sh; do
            [ -e "$f" ] || continue
            sh "$f"
          done

      - name: Admin persistence regressions
        run: |
          for f in test/edge_g*_admin.sh; do sh "$f"; done

      - name: Chromium interaction regression
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          google-chrome --version
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright test test/edge_*.spec.js --reporter=line --workers=1

      - name: Golden vectors
        run: make hpr-airwire-test DISABLE_INTERACTIVE=yes

      - name: Build readsb
        run: make -j"$(nproc)" readsb DISABLE_INTERACTIVE=yes OPTIMIZE="-O2"

      - name: Synthetic 400-aircraft websocket load
        run: python3 test/hpr_airwire_ws_synthetic.py --readsb ./readsb

  build:
    name: Build arm64 + armv7
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=edge-test,enable=${{ startsWith(github.ref, 'refs/heads/feat/edge-airwire-bin-') }}
            type=raw,value=edge-native,enable=${{ github.ref == 'refs/heads/feat/edge-atlas-v4.7-native-airwire-v2' }}
            type=raw,value=edge-ux,enable=${{ github.ref == 'refs/heads/feat/edge-e1-e7-ux' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=edge-,format=long
          labels: |
            org.opencontainers.image.title=HPRadar readsb Edge
            org.opencontainers.image.description=HPR readsb + native binary AirWire + Atlas V4.7 Edge UI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/edge.Dockerfile
          platforms: linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
