name: HPR Edge image

on:
  push:
    branches:
      - dev
      - "feat/edge-airwire-bin-*"
      - feat/edge-atlas-v4.7-native-airwire-v2
      - feat/edge-atlas-real-trace-replay
      - feat/edge-e1-e7-ux
    tags:
      - "edge-v*"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hpr-readsb-edge

jobs:
  test:
    name: AirWire + Edge FE tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libzstd-dev jq

      - name: Edge FE syntax
        run: |
          node --check hpr/edge/ui/airwire-adapter.js
          node --check hpr/edge/ui/aircraft-renderer.js
          node --check hpr/edge/ui/edge-history.js
          node --check hpr/edge/ui/edge-ui-patch.js
          node --check hpr/edge/ui/edge-calm-ui.js
          node --check hpr/edge/ui/edge-ops.js
          node --check hpr/edge/ui/edge-e1e7.js
          node --check hpr/edge/ui/edge-enrich.js
          node --check hpr/edge/ui/edge-traffic-enrich.js
          node --check hpr/edge/ui/edge-detail-cards.js
          node --check hpr/edge/ui/edge-map-policy.js
          node --check hpr/edge/ui/edge-admin-ui.js
          node --check hpr/edge/ui/edge-benchmark.js
          node --check tools/e7-manual-capture.js
          sh -n hpr/edge/entrypoint.sh
          sh -n hpr/edge/admin-v2.cgi

      - name: AirWire adapter runtime smoke
        run: node test/airwire_adapter_runtime_smoke.js

      - name: Calm UI + MapLibre expression runtime smoke
        run: node test/edge_calm_ui_runtime_smoke.js

      - name: Selected trace runtime smoke
        run: node test/edge_history_runtime_smoke.js

      - name: Persistent admin CGI smoke
        run: sh test/edge_admin_cgi_smoke.sh

      - name: Traffic enrichment runtime smoke
        run: node test/edge_traffic_enrich_runtime_smoke.js

      - name: Map label policy runtime smoke
        run: node test/edge_map_policy_runtime_smoke.js

      - name: Edge capability contract
        run: python3 test/edge_feature_score.py

      - name: Golden vectors
        run: make hpr-airwire-test DISABLE_INTERACTIVE=yes

      - name: Build readsb
        run: make -j"$(nproc)" readsb DISABLE_INTERACTIVE=yes OPTIMIZE="-O2"

      - name: readsb feeder CLI contract
        run: |
          ./readsb --help 2>&1 | grep -q -- '--uuid-file'
          ./readsb --help 2>&1 | grep -q -- '--net-connector'
          grep -q 'beast_reduce_plus_out' readsb.c
          grep -q 'strncmp(token\[k\], "uuid=", 5)' readsb.c

      - name: Synthetic 400-aircraft websocket load
        run: python3 test/hpr_airwire_ws_synthetic.py --readsb ./readsb

      - name: E7 comparator smoke
        run: |
          python3 -m py_compile test/e7_compare.py
          PYTHONPATH=test python3 test/e7_compare_smoke.py

  build:
    name: Build arm64 + armv7
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=edge-test,enable=${{ startsWith(github.ref, 'refs/heads/feat/edge-airwire-bin-') }}
            type=raw,value=edge-native,enable=${{ github.ref == 'refs/heads/feat/edge-atlas-v4.7-native-airwire-v2' }}
            type=raw,value=edge-next,enable=${{ github.ref == 'refs/heads/feat/edge-atlas-real-trace-replay' }}
            type=raw,value=edge-ux,enable=${{ github.ref == 'refs/heads/feat/edge-e1-e7-ux' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=edge-,format=long
          labels: |
            org.opencontainers.image.title=HPRadar readsb Edge
            org.opencontainers.image.description=HPR readsb + AirWire + Atlas Edge E1-E7 operator UX
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/edge.Dockerfile
          platforms: linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max