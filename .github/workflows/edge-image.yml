name: HPR Edge image

on:
  push:
    branches:
      - dev
      - feat/edge-atlas-v4.7-g3-g6
      - feat/edge-atlas-v4.7-production-parity
    tags:
      - "edge-v*"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: hpr-edge-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hpr-readsb-edge

jobs:
  build:
    name: Build arm64 + armv7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Atlas Edge FE gates G1-G6 readiness
        run: |
          bash test/edge-ui-g1.sh
          node test/edge-ui-g2.mjs
          node test/aircraft-renderer.test.mjs
          node test/airwire-adapter.test.mjs
          node test/station-context.test.mjs
          node test/edge-g6-capacity.test.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=edge-g6,enable=${{ github.ref == 'refs/heads/feat/edge-atlas-v4.7-g3-g6' }}
            type=raw,value=edge-v47-parity,enable=${{ github.ref == 'refs/heads/feat/edge-atlas-v4.7-production-parity' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=edge-
          labels: |
            org.opencontainers.image.title=HPRadar readsb Edge
            org.opencontainers.image.description=HPR readsb + AirWire + canonical Atlas V4.7 Edge UI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/edge.Dockerfile
          platforms: linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
