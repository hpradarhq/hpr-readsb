  <script type="text/javascript">
    <![CDATA[

document.addEventListener("DOMContentLoaded", () => {
    const ROTORS = {
        "L-rotor": {
            hubId: "L-hub",
            translate: [0, 0],
            rpm: 36
        },
        "R-rotor": {
            hubId: "R-hub",
            translate: [0, 0],
            rpm: 66
        }
    };

    // Get centers from hubs
    for (let id in ROTORS) {
        const hub = document.getElementById(ROTORS[id].hubId);
        if (hub) {
            const bbox = hub.getBBox();
            ROTORS[id].center = [
                bbox.x + bbox.width / 2,
                bbox.y + bbox.height / 2
            ];
        } else {
            console.warn(`Hub element not found: ${ROTORS[id].hubId}`);
            ROTORS[id].center = [0, 0]; // fallback
        }
    }

    // Animate rotors
    (function animateRotors(){
        const now = new Date();
        const elapsedMin = now.getTime() / 60000;

        for (let id in ROTORS) {
            const { center, translate, rpm } = ROTORS[id];
            const angle = (elapsedMin * rpm * 360) % 360;

            const el = document.getElementById(id);
            if (el && center) {
                el.setAttribute(
                    'transform',
                    `translate(${translate.join(',')}) rotate(${angle}, ${center.join(',')})`
                );
            }
        }

        requestAnimationFrame(animateRotors);
    })();
});
]]>
  </script>
