<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HPRadar Atlas Edge · FE 4.7.2</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
</head>
<body>
  <div id="map" aria-label="HPRadar Atlas Edge map"></div>

  <div id="shell">
    <header id="topbar">
      <div class="brand" aria-label="HPRadar Atlas Edge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/><path d="M12 12 18.5 7.5M12 3.5v2M20.5 12h-2M12 20.5v-2M3.5 12h2"/></svg>
        <span>HPRadar</span><span class="product">Atlas Edge</span><span class="build-tag">FE 4.7.2 · 260912.2</span>
      </div>
      <div class="top-search">
        <input id="search" autocomplete="off" placeholder="Flight, registration, ICAO, type…" aria-label="Search local aircraft">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
      <div id="chips" aria-live="polite"></div>
      <div class="top-fixed">
        <div id="connection" class="status-pill offline"><span class="status-dot"></span><span>AirWire offline</span></div>
        <button id="themeBtn" class="icon-btn" title="Toggle day/night" aria-label="Toggle theme"><span>◐</span></button>
      </div>
    </header>

    <main id="viewMap">
      <nav id="rail" aria-label="Atlas Edge commands">
        <button id="airBtn" class="rail-btn on" aria-controls="collection" aria-expanded="true" title="Aircraft">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-4.5L21 16Z"/></svg><span>Aircraft</span>
        </button>
        <button id="receiverBtn" class="rail-btn" title="Receiver">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21V11"/><path d="M7.5 11a4.5 4.5 0 0 1 9 0"/><path d="M4.5 11a7.5 7.5 0 0 1 15 0"/><circle cx="12" cy="11" r="1.4" fill="currentColor"/><path d="M9 21h6"/></svg><span>Receiver</span>
        </button>
        <div class="rail-sep"></div>
        <button id="layersBtn" class="rail-btn" title="Layers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg><span>Layers</span>
        </button>
        <button id="fitBtn" class="rail-btn" title="Fit all aircraft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span>Fit</span>
        </button>
      </nav>

      <section id="collection" class="open" aria-label="Aircraft collection">
        <div class="list-head"><strong>Aircraft</strong><span id="listCount">0 in view</span><button id="closeList" class="plain" aria-label="Close list">×</button></div>
        <div id="tabs">
          <button class="tab on" data-tab="visible">Visible</button>
          <button class="tab" data-tab="airborne">Airborne</button>
          <button class="tab" data-tab="mlat">MLAT</button>
          <button class="tab" data-tab="ground">Ground</button>
          <button class="tab" data-tab="stale">Stale</button>
        </div>
        <div id="airList"><div class="empty">Waiting for AirWire…</div></div>
      </section>

      <aside id="detail" aria-label="Selected aircraft detail"><div id="detailBody"></div></aside>

      <section id="layersPanel" class="tool-panel" aria-label="Layers">
        <div class="tool-head"><strong>Layers</strong><button id="closeLayers" class="plain" aria-label="Close layers">×</button></div>
        <label class="setting-row"><span>Aircraft labels</span><span class="switch"><input id="labelsSwitch" type="checkbox" checked><span class="track"></span></span></label>
        <label class="setting-row"><span>Selected trail</span><span class="switch"><input id="trailSwitch" type="checkbox" checked><span class="track"></span></span></label>
        <div class="tool-note">Aircraft shape follows ICAO type. Color follows altitude. Heading rotates the shape.</div>
      </section>

      <div id="coordDisplay">HPR ATLAS EDGE · AIRWIRE V1</div>
    </main>
  </div>

  <script src="./iconMap.js"></script>
  <script src="./app.js"></script>
</body>
</html>
