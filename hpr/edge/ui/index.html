<style>
*,*::before,*::after{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}

.detail-head{display:flex;gap:10px;align-items:center;padding:13px;border-bottom:1px solid var(--border)}.plane-big{width:48px;height:48px;border-radius:9px;background:var(--s2);display:grid;place-items:center;color:var(--air)}.plane-big svg,.plane-big img{max-width:38px;max-height:38px;width:100%;height:100%;object-fit:contain;transform:rotate(var(--hdg,0deg));filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}.detail-title{min-width:0;flex:1}.detail-title b,.detail-title small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-title b{font-size:16px}.detail-title small{color:var(--muted)}.close{font-size:20px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}.metric{padding:10px 12px;background:var(--surface)}.metric small,.metric b{display:block}.metric small{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.45px}.metric b{margin-top:2px;font-size:14px}.section{padding:12px;border-top:1px solid var(--border)}.section h3{margin:0 0 7px;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.kv{display:grid;grid-template-columns:112px 1fr;gap:5px 8px}.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){text-align:right;overflow-wrap:anywhere}

#footer{position:absolute;z-index:25;bottom:10px;left:50%;transform:translateX(-50%);padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font-size:9px;box-shadow:var(--shadow);white-space:nowrap}
.maplibregl-ctrl-top-right{top:9px!important;right:9px!important}.maplibregl-ctrl-group{background:var(--control)!important;border:1px solid var(--control-border)!important;box-shadow:var(--shadow)!important}.maplibregl-ctrl-group button{background:var(--control)!important}:root[data-theme="dark"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1) brightness(1.7)}
@media(max-width:900px){:root{--list:270px;--detail:310px}#chips{display:none}#detail{right:10px}.search-wrap{width:190px}}
@media(max-width:680px){#topbar{padding:0 8px}.build,.search-wrap{display:none}#rail{left:6px;top:auto;bottom:6px;width:auto;display:flex}.rail-btn{width:58px}#collection{left:6px;right:6px;top:calc(var(--top) + 6px);width:auto;max-height:44vh}#detail{left:6px;right:6px;top:auto;bottom:74px;width:auto;max-height:52vh}#footer{display:none}.maplibregl-ctrl-top-right{top:5px!important}}
</style>

<script>
(()=>{'use strict';
const AirWire=window.HPRAirWire,Renderer=window.HPRAircraftRenderer,StationContext=window.HPRStationContext;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const group=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,',');const fmt=(v,d=0)=>{if(v==null)return'—';const n=Number(v);if(!Number.isFinite(n))return'—';const neg=n<0?'-':'';const a=Math.abs(n).toFixed(d),dot=a.indexOf('.');return neg+group(dot<0?a:a.slice(0,dot))+(dot<0?'':a.slice(dot))};
const age=v=>v==null?'—':v<60?`${v.toFixed(v<10?1:0)} s`:`${Math.floor(v/60)}m ${Math.round(v%60)}s`;

const PREF_KEY='hprAtlasEdgePreferences';
let aircraft=[],receiver={},stats={},station={},stationView=StationContext.adapt(),selected=null,detailMode=null,tab='all',lastGood=0,lastEnvelope=null,lastCount=null,lastCountTs=null,msgRate=0,map,mapReady=false,firstFit=true,polling=false,styleGeneration=0,searchCursor=-1,follow=false;
const preferences={aircraft:true,labels:true,trails:true,labelDensity:'operational',filterAlt:'all',watch:[],notifyEmergency:true,perfHud:false,lang:'en'};
function label(a){return a.callsign||a.registration||a.id.toUpperCase()}function stColor(s){return s==='live'?'var(--live)':s==='aging'?'var(--aging)':'var(--stale)'}function altitude(a){return a.isGround?'GROUND':a.barometricAltitudeFt==null?'—':`${fmt(a.barometricAltitudeFt)} ft`}function method(a){return a.isMlat?'MLAT':a.source}
function distBearing(a){const s=stationView;if(s.latitude==null||s.longitude==null||!a.coordinates)return null;const r=3440.065,toRad=x=>x*Math.PI/180,lat1=toRad(s.latitude),lat2=toRad(a.latitude),dlat=toRad(a.latitude-s.latitude),dlon=toRad(a.longitude-s.longitude),h=Math.sin(dlat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlon/2)**2,nm=2*r*Math.asin(Math.min(1,Math.sqrt(h))),y=Math.sin(dlon)*Math.cos(lat2),x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dlon),br=(Math.atan2(y,x)*180/Math.PI+360)%360;return{nm,br}}
function coverage(){const withPos=aircraft.filter(a=>a.coordinates),ranges=withPos.map(a=>distBearing(a)).filter(Boolean).map(d=>d.nm).sort((a,b)=>a-b),max=ranges.length?ranges[ranges.length-1]:null,avg=ranges.length?ranges.reduce((s,x)=>s+x,0)/ranges.length:null,bands=[0,0,0,0,0,0];for(const a of aircraft)bands[Renderer.altBand(a.barometricAltitudeFt)]++;return{max,avg,withPos:withPos.length,bands}}

function projectPosition(a,nowMs){const c=a.coordinates;if(!c)return null;if(a.isGround||a.groundSpeedKt==null||a.trackDeg==null)return c;const anchor=(lastEnvelope?.generationTime||Date.now()/1000)*1000-(a.seenPositionSec||0)*1000,dt=Math.min((nowMs-anchor)/1000,60);if(!(dt>0.5))return c;const distNm=Math.min(a.groundSpeedKt*dt/3600,8);if(!(distNm>0))return c;const br=a.trackDeg*Math.PI/180,d=distNm/3440.065,lat1=a.latitude*Math.PI/180,lon1=a.longitude*Math.PI/180,lat2=Math.asin(Math.sin(lat1)*Math.cos(d)+Math.cos(lat1)*Math.sin(d)*Math.cos(br)),lon2=lon1+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(lat1),Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));return[lon2*180/Math.PI,lat2*180/Math.PI]}

  map.addLayer({id:'aircraft-halo',type:'circle',source:'aircraft',paint:{'circle-radius':['case',['==',['get','selected'],1],13,8],'circle-color':'transparent','circle-stroke-width':['case',['==',['get','selected'],1],2,1],'circle-stroke-color':['case',['==',['get','selected'],1],'#59ddff',['match',['get','status'],'live','#42dfa3','aging','#ffb84d','#70869c']],'circle-opacity':.85}});
  map.addLayer({id:'aircraft-symbol',type:'symbol',source:'aircraft',layout:{'icon-image':['concat','aircraft-',['get','icon'],'-',['get','band']],'icon-size':['interpolate',['linear'],['zoom'],5,.56,8,.72,12,.96],'icon-rotate':['get','track'],'icon-rotation-alignment':'map','icon-allow-overlap':true}});
  map.addLayer({id:'aircraft-label',type:'symbol',source:'aircraft',minzoom:6.2,layout:{'text-field':['format',['get','label'],{'font-scale':1},'\n',{},['get','altitude'],{'font-scale':.78}],'text-font':['Noto Sans Regular'],'text-size':10,'text-offset':[0,2.35],'text-optional':true,'text-allow-overlap':false},paint:{'text-color':document.documentElement.dataset.theme==='dark'?'#dbe6f4':'#243746','text-halo-color':document.documentElement.dataset.theme==='dark'?'#071018':'#fff','text-halo-width':1.2}});
  map.addLayer({id:'aircraft-hit',type:'circle',source:'aircraft',paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,12,10,18],'circle-color':'#000','circle-opacity':.01}});
  map.on('click','aircraft-hit',e=>{const id=e.features?.[0]?.properties?.id;if(id)selectAircraft(String(id),false)});
  map.on('mouseenter','aircraft-hit',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','aircraft-hit',()=>map.getCanvas().style.cursor='');
  mapReady=true;applyLayerVisibility();updateMap();if(firstFit&&aircraft.some(a=>a.coordinates)){firstFit=false;fitAll()}
}
function updateMap(){if(!mapReady)return;const src=map.getSource('aircraft');if(src)src.setData(fc())}
let liveRaf=0,lastLive=0,lastTrail=0,lastFollow=0,lastImages=0,perfLast=0,perfFrames=0,perfAccum=0;
function liveFrame(ts){if(mapReady){if(ts-lastLive>=90){lastLive=ts;const src=map.getSource('aircraft');if(src)src.setData(fc())}if(ts-lastImages>=1000){lastImages=ts;void ensureImages()}if(follow&&selected&&ts-lastFollow>=150){lastFollow=ts;const a=aircraft.find(x=>x.id===selected);if(a&&a.coordinates)map.jumpTo({center:projectPosition(a,Date.now())||a.coordinates})}if(preferences.trails&&ts-lastTrail>=1500){lastTrail=ts;const tsrc=map.getSource('hpr-live-trail');if(tsrc)tsrc.setData(trailFC())}}
if(preferences.perfHud){const d=ts-perfLast;perfLast=ts;if(d>0&&d<1000){perfFrames++;perfAccum+=d;if(perfFrames>=30){const hud=$('#perfHud');if(hud){hud.hidden=false;hud.textContent=`${(1000/(perfAccum/perfFrames)).toFixed(0)} fps · ${aircraft.length} ac · ${mapReady?'map':'…'}`}perfFrames=0;perfAccum=0}}}else{const hud=$('#perfHud');if(hud&&!hud.hidden)hud.hidden=true}
liveRaf=requestAnimationFrame(liveFrame)}
function fitAll(){if(!mapReady)return;const pts=aircraft.filter(a=>a.coordinates);if(!pts.length)return;const b=new maplibregl.LngLatBounds();pts.forEach(a=>b.extend(a.coordinates));map.fitBounds(b,{padding:{top:70,bottom:70,left:390,right:390},maxZoom:8,duration:450})}
function selectAircraft(id,fly){selected=id;renderList();renderDetail();updateMap();const a=aircraft.find(x=>x.id===id);if(fly&&a?.coordinates)map.flyTo({center:a.coordinates,zoom:Math.max(map.getZoom(),7),duration:450})}
function setConnected(ok){const el=$('#connection');el.classList.toggle('offline',!ok);el.querySelector('span').textContent=ok?`LIVE · ${aircraft.length}`:'AirWire offline'}
async function jsonOrEmpty(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():{}}catch(_){return{}}}
async function loadContext(){[receiver,stats,station]=await Promise.all([jsonOrEmpty('/api/readsb/receiver.json'),jsonOrEmpty('/data/stats.json'),jsonOrEmpty('/api/readsb/station.json')]);stationView=StationContext.adapt(receiver,stats,station);if(detailMode==='receiver')renderReceiver()}
async function tick(){if(polling)return;polling=true;try{const r=await fetch('/api/air/v1',{cache:'no-store'});if(!r.ok)throw Error(r.status);const snapshot=AirWire.adaptEnvelope(await r.json());lastEnvelope=snapshot;aircraft=snapshot.aircraft;lastGood=Date.now();setConnected(true);checkAlerts();const now=Date.now(),count=snapshot.totalMessages;if(lastCount!=null&&count>=lastCount)msgRate=(count-lastCount)/Math.max((now-lastCountTs)/1000,.001);lastCount=count;lastCountTs=now;renderChips();renderList();if(selected)renderDetail();if(firstFit&&mapReady&&aircraft.some(a=>a.coordinates)){firstFit=false;fitAll()}}catch(_){if(Date.now()-lastGood>3500)setConnected(false)}finally{polling=false}}
function applyThemeStyle(){styleGeneration++;mapReady=false;map.setStyle(document.documentElement.dataset.theme==='dark'?DARK_STYLE:LIGHT_STYLE);map.once('style.load',()=>installLayers())}
function initMap(){map=new maplibregl.Map({container:'map',style:document.documentElement.dataset.theme==='dark'?DARK_STYLE:LIGHT_STYLE,center:[106.3,20.7],zoom:6.3,attributionControl:false});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');if(maplibregl.GlobeControl)map.addControl(new maplibregl.GlobeControl(),'top-right');map.addControl(new maplibregl.FullscreenControl({container:document.body}),'top-right');map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');map.on('load',()=>installLayers());map.on('dragstart',()=>{if(follow){follow=false;const fb=$('#followBtn');if(fb)fb.classList.remove('on')}})}

function compositionMode(){return innerWidth<681?'mobile':innerWidth<901?'tablet':'desktop'}
function syncAdaptiveChrome(){document.body.dataset.composition=compositionMode()}
$('#search').oninput=()=>{searchCursor=-1;$('#collection').classList.add('open');renderList()};$('#search').onkeydown=e=>{const rows=filtered();if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!rows.length)return;searchCursor=(searchCursor+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;renderList()}else if(e.key==='Enter'&&rows.length){e.preventDefault();selectAircraft(rows[Math.max(0,searchCursor)]?.id,true)}else if(e.key==='Escape'){e.preventDefault();$('#search').value='';searchCursor=-1;renderList()}};
$('#airBtn').onclick=()=>{$('#collection').classList.toggle('open');$('#airBtn').classList.toggle('on',$('#collection').classList.contains('open'))};$('#receiverBtn').onclick=()=>{selected=null;renderList();updateMap();renderReceiver()};$('#layersBtn').onclick=()=>renderTool('layers');$('#settingsBtn').onclick=()=>renderTool('settings');$('#fitBtn').onclick=fitAll;$('#closeList').onclick=()=>{$('#collection').classList.remove('open');$('#airBtn').classList.remove('on')};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;renderList()});$$('#altFilter button').forEach(b=>b.onclick=()=>{preferences.filterAlt=b.dataset.alt;syncAltFilter();persistPreferences();renderList()});
$('#themeBtn').onclick=()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';persistPreferences();applyThemeStyle()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement!==$('#search'))closeDetail()});window.addEventListener('resize',syncAdaptiveChrome);
restorePreferences();syncAltFilter();applyLang();syncAdaptiveChrome();initMap();liveRaf=requestAnimationFrame(liveFrame);loadContext();tick();setInterval(tick,1000);setInterval(loadContext,30000);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
window.__hprFE={projectPosition,fc,trailFC,toast,state:()=>({mapReady,aircraft:aircraft.length,selected,envelope:!!lastEnvelope,follow,filterAlt:preferences.filterAlt,watch:preferences.watch.slice(),lang:preferences.lang,perfHud:preferences.perfHud})};
})();
</script>
