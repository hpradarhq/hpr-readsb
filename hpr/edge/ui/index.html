<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HPRadar Atlas Edge</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org">
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    :root{--top:48px;--rail:66px;--list:280px;--detail:320px;--gap:10px;--r:8px;--bg:#eef2f6;--surface:rgba(255,255,255,.95);--surface2:#f6f9fc;--border:#cbd5e1;--text:#0f172a;--text2:#334155;--muted:#64748b;--accent:#0369a1;--air:#9a5b00;--live:#15803d;--aging:#b45309;--stale:#64748b;--danger:#dc2626;--shadow:0 4px 18px rgba(15,23,42,.18)}
    :root[data-theme="dark"]{--bg:#030609;--surface:rgba(11,15,26,.93);--surface2:#111726;--border:#1e2d44;--text:#f1f6ff;--text2:#a8bcd9;--muted:#7d93b3;--accent:#00e5ff;--air:#f2cf5b;--live:#34d399;--aging:#f59e0b;--stale:#7186a3;--danger:#f87171;--shadow:0 4px 18px rgba(0,0,0,.5)}
    body{font:13px/1.4 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    button,input{font:inherit}.num{font-variant-numeric:tabular-nums}button{cursor:pointer}
    #map{position:absolute;inset:var(--top) 0 0;background:#081018}
    #topbar{position:absolute;z-index:50;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);backdrop-filter:blur(9px)}
    .brand{display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--accent);font-weight:800}.brand svg{width:18px;height:18px}.brand span{color:var(--text)}.build{padding:2px 5px;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:9px;letter-spacing:.5px}
    #search{width:min(210px,24vw);height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);outline:none}#search:focus{border-color:var(--accent)}
    #chips{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}.chip{height:28px;display:flex;align-items:center;gap:5px;padding:0 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text2);white-space:nowrap;font-size:11px}.chip b{color:var(--text)}.dot{width:7px;height:7px;border-radius:50%;background:var(--live)}
    .top-right{display:flex;align-items:center;gap:7px;margin-left:auto}.state{height:30px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text2);white-space:nowrap}.state.offline .dot{background:var(--danger)}
    .icon-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);display:grid;place-items:center}
    #rail{position:absolute;z-index:30;left:10px;top:calc(var(--top) + 10px);width:var(--rail);padding:4px;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
    .rail-btn{width:56px;border:0;border-radius:6px;background:transparent;color:var(--text2);padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}.rail-btn:hover{background:var(--surface2);color:var(--text)}.rail-btn.on{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}.rail-btn svg{width:20px;height:20px}.rail-btn span{font-size:9px;font-weight:700}
    #listPanel{position:absolute;z-index:25;left:86px;top:calc(var(--top) + 10px);width:var(--list);max-height:calc(100vh - var(--top) - 20px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(9px);overflow:hidden}
    .panel-head{height:41px;display:flex;align-items:center;gap:8px;padding:0 11px;border-bottom:1px solid var(--border)}.panel-head b{font-size:11px;letter-spacing:.6px;text-transform:uppercase}.panel-head span{margin-left:auto;color:var(--muted);font-size:10px}
    #airList{overflow:auto}.row{width:100%;min-height:57px;padding:7px 10px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);text-align:left;display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center}.row:hover{background:var(--surface2)}.row.selected{background:color-mix(in srgb,var(--air) 12%,transparent)}.row-dot{width:7px;height:7px;border-radius:50%;background:var(--st)}.main{min-width:0}.line{display:flex;align-items:baseline;gap:7px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:2px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi{font-weight:800;color:var(--air);white-space:nowrap}.empty{padding:26px 14px;text-align:center;color:var(--muted)}
    #detail{position:absolute;z-index:28;right:56px;top:calc(var(--top) + 10px);width:var(--detail);max-height:calc(100vh - var(--top) - 20px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(9px);overflow:auto;display:none}#detail.open{display:block}
    .detail-head{display:flex;gap:9px;align-items:center;padding:13px;border-bottom:1px solid var(--border)}.plane{width:42px;height:42px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;color:var(--air);font-size:25px}.detail-title{min-width:0;flex:1}.detail-title b,.detail-title small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-title b{font-size:16px}.detail-title small{color:var(--muted)}.close{width:28px;height:28px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:20px}.close:hover{background:var(--surface2);color:var(--text)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}.metric{padding:10px 12px;background:var(--surface)}.metric small,.metric b{display:block}.metric small{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.5px}.metric b{margin-top:2px;font-size:14px}.section{padding:12px;border-top:1px solid var(--border)}.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 8px;margin-top:6px}.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){text-align:right;overflow-wrap:anywhere}
    #receiverCard .section:first-child{border-top:0}.ok{color:var(--live)}.warn{color:var(--aging)}
    #footer{position:absolute;z-index:22;bottom:10px;left:50%;transform:translateX(-50%);padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font-size:10px;box-shadow:var(--shadow);white-space:nowrap}
    .maplibregl-ctrl-top-right{top:9px;right:9px}.maplibregl-ctrl-group{background:var(--surface)!important;border:1px solid var(--border);box-shadow:var(--shadow)!important}.maplibregl-ctrl button .maplibregl-ctrl-icon{filter:var(--map-filter,none)}
    @media(max-width:900px){:root{--list:260px;--detail:300px}#chips{display:none}#detail{right:10px}#search{width:180px}}
    @media(max-width:680px){#topbar{padding:0 8px}.build,#search{display:none}#rail{left:6px;top:auto;bottom:6px;width:auto;display:flex}.rail-btn{width:60px}#listPanel{left:6px;right:6px;top:calc(var(--top) + 6px);width:auto;max-height:44vh}#detail{left:6px;right:6px;top:auto;bottom:74px;width:auto;max-height:48vh}#footer{display:none}.maplibregl-ctrl-top-right{top:5px}}
  </style>
</head>
<body>
  <div id="map"></div>
  <header id="topbar">
    <div class="brand" title="HPRadar Atlas Edge">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 12h18M12 3v18M5.5 5.5l13 13M18.5 5.5l-13 13" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/></svg>
      HPRadar <span>Atlas Edge</span><i class="build">V4.7 / AirWire</i>
    </div>
    <input id="search" placeholder="Flight, reg or ICAO" autocomplete="off">
    <div id="chips"></div>
    <div class="top-right">
      <div id="connection" class="state offline"><i class="dot"></i><span>Waiting for readsb</span></div>
      <button id="themeBtn" class="icon-btn" title="Toggle theme">◐</button>
    </div>
  </header>

  <nav id="rail">
    <button id="airBtn" class="rail-btn on" title="Aircraft">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.2 7.1 6.8 3v2l-6.8-1.1-.8 6 2.6 1.7V22L12 21l-4 1v-1.3L10.6 19l-.8-6L3 14.1v-2l6.8-3L12 2Z" fill="currentColor"/></svg><span>Aircraft</span>
    </button>
    <button id="receiverBtn" class="rail-btn" title="Receiver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.5 5.5a9 9 0 0 0 0 13M18.5 5.5a9 9 0 0 1 0 13"/></svg><span>Receiver</span>
    </button>
  </nav>

  <aside id="listPanel">
    <div class="panel-head"><b>Local aircraft</b><span id="listCount">0 in view</span></div>
    <div id="airList"><div class="empty">Waiting for AirWire…</div></div>
  </aside>

  <aside id="detail">
    <div id="airDetail"></div>
    <div id="receiverCard"></div>
  </aside>

  <div id="footer">HPR ATLAS EDGE · readsb → AirWire v1 → UI</div>

<script>
(() => {
  'use strict';

  const F={HEX:0,CLASS:1,FLAGS:2,CALL:3,LAT:4,LON:5,BARO:6,GEOM:7,GS:8,TRACK:9,BARO_RATE:10,GEOM_RATE:11,SQUAWK:12,CATEGORY:13,EMERGENCY:14,SEEN_POS:15,SEEN:16,RSSI:17,REG:18,TYPE:19,DB:20,MSGS:21};
  const FLAG={GROUND:1,ALERT:2,SPI:4,NON_ICAO:8,POSITION:16,MLAT:32};
  const sourceNames=['ADS-B','ADS-B NT','ADS-R','TIS-B','ADS-C','MLAT','Other','Mode-S','ADS-B other','ADS-R other','TIS-B track','TIS-B other','Mode-A','Unknown'];
  const emergencyNames=['None','General','Lifeguard','Min fuel','NORDO','Unlawful','Downed','Reserved'];
  const $=s=>document.querySelector(s);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=(v,d=0)=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
  const age=v=>v==null?'—':v<60?`${v.toFixed(v<10?1:0)} s`:`${Math.floor(v/60)}m ${Math.round(v%60)}s`;
  const statusFor=s=>s<=10?'live':s<=30?'aging':'stale';
  const statusColor=s=>s==='live'?'var(--live)':s==='aging'?'var(--aging)':'var(--stale)';
  const altitude=a=>a.ground?'GROUND':a.baro==null?'—':`${fmt(a.baro)} ft`;
  const rate=v=>v==null?'—':`${v>0?'+':''}${fmt(v)} fpm`;

  let aircraft=[];
  let selectedId=null;
  let receiver=null;
  let lastEnvelope=null;
  let messageRate=0;
  let firstFit=true;
  let polling=false;
  let lastGood=0;
  let map=null;
  let mapReady=false;

  function decodeRow(r){
    const flags=Number(r[F.FLAGS]||0);
    const seen=Number(r[F.SEEN]||0);
    const lat=r[F.LAT],lon=r[F.LON];
    return {
      id:String(r[F.HEX]||''),sourceClass:Number(r[F.CLASS]??13),flags,
      callsign:r[F.CALL]||null,coord:lat!=null&&lon!=null?[Number(lon),Number(lat)]:null,
      baro:r[F.BARO],geom:r[F.GEOM],gs:r[F.GS],track:r[F.TRACK],baroRate:r[F.BARO_RATE],geomRate:r[F.GEOM_RATE],
      squawk:r[F.SQUAWK],category:r[F.CATEGORY],emergency:r[F.EMERGENCY],seenPos:r[F.SEEN_POS],seen,
      rssi:r[F.RSSI],registration:r[F.REG],type:r[F.TYPE],dbFlags:Number(r[F.DB]||0),messages:Number(r[F.MSGS]||0),
      ground:!!(flags&FLAG.GROUND),mlat:!!(flags&FLAG.MLAT),alert:!!(flags&FLAG.ALERT),spi:!!(flags&FLAG.SPI),
      status:statusFor(seen)
    };
  }

  function label(a){return a.callsign||a.registration||a.id.toUpperCase()}
  function method(a){return a.mlat?'MLAT':(sourceNames[a.sourceClass]||'Unknown')}

  function renderChips(){
    const airborne=aircraft.filter(a=>!a.ground).length;
    const ground=aircraft.filter(a=>a.ground).length;
    const mlat=aircraft.filter(a=>a.mlat).length;
    $('#chips').innerHTML=[['Aircraft',aircraft.length],['Airborne',airborne],['Ground',ground],['MLAT',mlat],['Rate',`${fmt(messageRate,0)} msg/s`]].map(([k,v])=>`<div class="chip"><i class="dot"></i><span>${k}</span><b class="num">${v}</b></div>`).join('');
  }

  function filtered(){
    const q=$('#search').value.trim().toLowerCase();
    const rows=q?aircraft.filter(a=>[a.id,a.callsign,a.registration,a.type].some(v=>String(v||'').toLowerCase().includes(q))):aircraft;
    return rows.slice().sort((a,b)=>a.seen-b.seen||label(a).localeCompare(label(b)));
  }

  function renderList(){
    const rows=filtered();
    $('#listCount').textContent=`${rows.length} matched`;
    $('#airList').innerHTML=rows.length?rows.map(a=>`<button class="row ${a.id===selectedId?'selected':''}" data-id="${esc(a.id)}"><i class="row-dot" style="--st:${statusColor(a.status)}"></i><span class="main"><span class="line"><span class="name">${esc(label(a))}</span></span><span class="meta">${esc(a.registration||a.id.toUpperCase())} · ${esc(a.type||method(a))} · ${age(a.seen)}</span></span><span class="kpi num">${altitude(a)}</span></button>`).join(''):'<div class="empty">No aircraft match this filter</div>';
    document.querySelectorAll('.row').forEach(el=>el.onclick=()=>selectAircraft(el.dataset.id,true));
  }

  function detailKV(items){return `<div class="section"><div class="kv">${items.map(([k,v])=>`<span>${esc(k)}</span><span>${v}</span>`).join('')}</div></div>`}

  function renderAircraftDetail(a){
    if(!a){$('#detail').classList.remove('open');return}
    $('#receiverCard').innerHTML='';
    $('#airDetail').innerHTML=`
      <div class="detail-head"><div class="plane">✈</div><div class="detail-title"><b>${esc(label(a))}</b><small>${esc(a.registration||a.id.toUpperCase())} · ${esc(a.type||method(a))}</small></div><button class="close" id="closeDetail">×</button></div>
      <div class="grid">
        <div class="metric"><small>Altitude</small><b class="num">${altitude(a)}</b></div>
        <div class="metric"><small>Ground speed</small><b class="num">${a.gs==null?'—':fmt(a.gs,1)+' kt'}</b></div>
        <div class="metric"><small>Track</small><b class="num">${a.track==null?'—':fmt(a.track,1)+'°'}</b></div>
        <div class="metric"><small>Vertical rate</small><b class="num">${rate(a.baroRate??a.geomRate)}</b></div>
      </div>
      ${detailKV([
        ['ICAO',`<code>${esc(a.id.toUpperCase())}</code>`],['Source',esc(method(a))],['Squawk',esc(a.squawk||'—')],
        ['RSSI',a.rssi==null?'—':`${fmt(a.rssi,1)} dBFS`],['Seen',age(a.seen)],['Position age',a.seenPos==null?'—':age(Number(a.seenPos))],
        ['Messages',fmt(a.messages)],['Geom alt',a.geom==null?'—':`${fmt(a.geom)} ft`],['Emergency',esc(a.emergency==null?'—':emergencyNames[a.emergency]||String(a.emergency))],
        ['Flags',`<code>0x${a.flags.toString(16).padStart(2,'0')}</code>`]
      ])}`;
    $('#detail').classList.add('open');
    $('#closeDetail').onclick=()=>{selectedId=null;$('#detail').classList.remove('open');renderList();updateSelection()};
  }

  function renderReceiver(){
    $('#airDetail').innerHTML='';
    const r=receiver||{};
    $('#receiverCard').innerHTML=`<div class="detail-head"><div class="plane">◉</div><div class="detail-title"><b>Local receiver</b><small>HPR readsb edge</small></div><button class="close" id="closeDetail">×</button></div>${detailKV([
      ['Status',lastGood&&Date.now()-lastGood<5000?'<b class="ok">LIVE</b>':'<b class="warn">WAITING</b>'],
      ['readsb',esc(r.version||'—')],['Refresh',r.refresh!=null?`${esc(r.refresh)} ms`:'—'],
      ['Latitude',r.lat!=null?`<span class="num">${Number(r.lat).toFixed(6)}</span>`:'—'],['Longitude',r.lon!=null?`<span class="num">${Number(r.lon).toFixed(6)}</span>`:'—'],
      ['Aircraft',fmt(aircraft.length)],['Message rate',`${fmt(messageRate,0)} msg/s`],['AirWire','v1']
    ])}`;
    $('#detail').classList.add('open');
    $('#closeDetail').onclick=()=>$('#detail').classList.remove('open');
  }

  function selectAircraft(id,focus=false){
    selectedId=id;
    const a=aircraft.find(x=>x.id===id);
    renderList();renderAircraftDetail(a);updateSelection();
    if(focus&&mapReady&&a?.coord)map.easeTo({center:a.coord,zoom:Math.max(map.getZoom(),9),duration:450});
  }

  function featureCollection(){return {type:'FeatureCollection',features:aircraft.filter(a=>a.coord).map(a=>({type:'Feature',properties:{id:a.id,label:label(a),track:Number(a.track||0),status:a.status,ground:a.ground?1:0},geometry:{type:'Point',coordinates:a.coord}}))}}

  function updateSelection(){
    if(!mapReady)return;
    const a=aircraft.find(x=>x.id===selectedId);
    map.getSource('selected')?.setData({type:'FeatureCollection',features:a?.coord?[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:a.coord}}]:[]});
  }

  function updateMapData(){
    if(!mapReady)return;
    map.getSource('aircraft')?.setData(featureCollection());
    updateSelection();
    if(receiver?.lat!=null&&receiver?.lon!=null){map.getSource('receiver')?.setData({type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:[Number(receiver.lon),Number(receiver.lat)]}}]})}
    if(firstFit){
      firstFit=false;
      if(receiver?.lat!=null&&receiver?.lon!=null)map.easeTo({center:[Number(receiver.lon),Number(receiver.lat)],zoom:8.5,duration:0});
      else {
        const pts=aircraft.filter(a=>a.coord);
        if(pts.length){const b=new maplibregl.LngLatBounds(pts[0].coord,pts[0].coord);pts.slice(1).forEach(a=>b.extend(a.coord));map.fitBounds(b,{padding:80,maxZoom:9,duration:0})}
      }
    }
  }

  function installLayers(){
    if(map.getSource('aircraft'))return;
    map.addSource('aircraft',{type:'geojson',data:featureCollection()});
    map.addSource('selected',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    map.addSource('receiver',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    map.addLayer({id:'selected',type:'circle',source:'selected',paint:{'circle-radius':16,'circle-color':'transparent','circle-stroke-color':'#00e5ff','circle-stroke-width':2}});
    map.addLayer({id:'aircraft-hit',type:'circle',source:'aircraft',paint:{'circle-radius':15,'circle-opacity':0}});
    map.addLayer({id:'aircraft-symbol',type:'symbol',source:'aircraft',layout:{'text-field':'✈','text-size':['interpolate',['linear'],['zoom'],5,15,10,21],'text-rotate':['get','track'],'text-rotation-alignment':'map','text-allow-overlap':true},paint:{'text-color':'#f2cf5b','text-halo-color':'#111827','text-halo-width':1}});
    map.addLayer({id:'aircraft-label',type:'symbol',source:'aircraft',minzoom:7.5,layout:{'text-field':['get','label'],'text-size':10,'text-offset':[0,1.8],'text-anchor':'top','text-allow-overlap':false},paint:{'text-color':'#f8fafc','text-halo-color':'#0b0f1a','text-halo-width':1.2}});
    map.addLayer({id:'receiver',type:'circle',source:'receiver',paint:{'circle-radius':6,'circle-color':'#24e5d1','circle-stroke-color':'#071018','circle-stroke-width':2}});
    map.on('click','aircraft-hit',e=>{const id=e.features?.[0]?.properties?.id;if(id)selectAircraft(id,false)});
    map.on('mouseenter','aircraft-hit',()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave','aircraft-hit',()=>map.getCanvas().style.cursor='grab');
    updateMapData();
  }

  function startMap(){
    map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/dark',center:[106.7,20.85],zoom:7.5,attributionControl:true});
    map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
    map.on('load',()=>{mapReady=true;installLayers()});
  }

  async function loadReceiver(){
    try{const r=await fetch('/api/readsb/receiver.json',{cache:'no-store'});if(r.ok){receiver=await r.json();updateMapData()}}catch(_){ }
  }

  async function tick(){
    if(polling)return;polling=true;
    try{
      const res=await fetch('/api/air/v1',{cache:'no-store'});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const env=await res.json();
      if(!Array.isArray(env)||env[0]!==1||!Array.isArray(env[3]))throw new Error('AirWire v1 expected');
      const now=Number(env[1]),total=Number(env[2]);
      if(lastEnvelope&&now>lastEnvelope.now)messageRate=Math.max(0,(total-lastEnvelope.total)/((now-lastEnvelope.now)/1000));
      lastEnvelope={now,total};
      aircraft=env[3].map(decodeRow);
      if(selectedId&&!aircraft.some(a=>a.id===selectedId))selectedId=null;
      lastGood=Date.now();
      $('#connection').classList.remove('offline');$('#connection span').textContent='readsb live';
      renderChips();renderList();updateMapData();
      if(selectedId)renderAircraftDetail(aircraft.find(a=>a.id===selectedId));
    }catch(err){
      if(Date.now()-lastGood>4000){$('#connection').classList.add('offline');$('#connection span').textContent='Waiting for readsb'}
      if(!lastGood)$('#airList').innerHTML='<div class="empty">Waiting for AirWire…</div>';
    }finally{polling=false}
  }

  $('#search').addEventListener('input',renderList);
  $('#airBtn').onclick=()=>{$('#airBtn').classList.add('on');$('#receiverBtn').classList.remove('on');$('#listPanel').style.display='flex';if(selectedId)renderAircraftDetail(aircraft.find(a=>a.id===selectedId));else $('#detail').classList.remove('open')};
  $('#receiverBtn').onclick=()=>{$('#receiverBtn').classList.add('on');$('#airBtn').classList.remove('on');renderReceiver()};
  $('#themeBtn').onclick=()=>{const root=document.documentElement,dark=root.dataset.theme==='dark';root.dataset.theme=dark?'light':'dark';if(map){const center=map.getCenter(),zoom=map.getZoom(),bearing=map.getBearing();map.setStyle(`https://tiles.openfreemap.org/styles/${dark?'liberty':'dark'}`);mapReady=false;map.once('style.load',()=>{mapReady=true;installLayers();map.jumpTo({center,zoom,bearing})})}};

  startMap();loadReceiver();tick();
  setInterval(tick,1000);setInterval(loadReceiver,10000);
})();
</script>
</body>
</html>
