function aircraftShape(a){const t=String(a.type||'').toUpperCase();if(HEAVY.has(t))return'heavy_2e';if(TWIN.has(t))return'twin_large';if(HELI.has(t)||t.startsWith('EC')||t.startsWith('AS'))return'puma';return'airliner'}
function aircraftSvg(shape='airliner',color='currentColor'){const x=AIRCRAFT_SHAPES[shape]||AIRCRAFT_SHAPES.airliner;return `<svg viewBox="${x.viewBox}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="${x.path}" fill="${color}" stroke="#111827" stroke-width=".7" stroke-linejoin="round"/></svg>`}

let aircraft=[],receiver=null,selected=null,tab='all',lastGood=0,lastEnvelope=null,lastCount=null,lastCountTs=null,msgRate=0,map,mapReady=false,firstFit=true,polling=false,styleGeneration=0;
function decode(r){const flags=Number(r[F.FLAGS]||0),seen=Number(r[F.SEEN]||0);return{id:String(r[F.HEX]||''),cls:Number(r[F.CLASS]??13),flags,callsign:r[F.CALL]||null,coord:r[F.LAT]!=null&&r[F.LON]!=null?[Number(r[F.LON]),Number(r[F.LAT])]:null,baro:r[F.BARO],geom:r[F.GEOM],gs:r[F.GS],track:r[F.TRACK],baroRate:r[F.BARO_RATE],geomRate:r[F.GEOM_RATE],squawk:r[F.SQUAWK],category:r[F.CATEGORY],emergency:r[F.EMERGENCY],seenPos:r[F.SEEN_POS],seen,rssi:r[F.RSSI],registration:r[F.REG],type:r[F.TYPE],db:r[F.DB],messages:r[F.MSGS],ground:!!(flags&FLAG.GROUND),mlat:!!(flags&FLAG.MLAT),alert:!!(flags&FLAG.ALERT),position:!!(flags&FLAG.POSITION),status:seen<=10?'live':seen<=30?'aging':'stale'}}
function label(a){return a.callsign||a.registration||a.id.toUpperCase()}function stColor(s){return s==='live'?'var(--live)':s==='aging'?'var(--aging)':'var(--stale)'}function altitude(a){return a.ground?'GROUND':a.baro==null?'—':`${fmt(a.baro)} ft`}function method(a){return a.mlat?'MLAT':(sourceNames[a.cls]||'Unknown')}
function filtered(){const q=$('#search').value.trim().toLowerCase();return aircraft.filter(a=>{if(tab==='airborne'&&a.ground)return false;if(tab==='ground'&&!a.ground)return false;if(tab==='mlat'&&!a.mlat)return false;if(!q)return true;return[a.id,a.callsign,a.registration,a.type].some(v=>String(v||'').toLowerCase().includes(q))}).sort((a,b)=>a.seen-b.seen||label(a).localeCompare(label(b)))}
function renderChips(){const live=aircraft.filter(a=>a.status==='live').length,mlat=aircraft.filter(a=>a.mlat).length,ground=aircraft.filter(a=>a.ground).length;$('#chips').innerHTML=`<div class="chip"><i class="dot"></i><b>${aircraft.length}</b> aircraft</div><div class="chip"><b>${live}</b> live</div><div class="chip"><b>${mlat}</b> MLAT</div><div class="chip"><b>${ground}</b> ground</div><div class="chip"><b>${fmt(msgRate,0)}</b> msg/s</div>`}
function planeMarkup(a){return aircraftSvg(aircraftShape(a),'currentColor')}
function renderList(){const rows=filtered();$('#listCount').textContent=`${rows.length} shown`;$('#airList').innerHTML=rows.length?rows.map(a=>`<button class="row ${selected===a.id?'selected':''}" data-id="${esc(a.id)}"><i class="row-dot" style="--st:${stColor(a.status)}"></i><span class="plane-icon" style="--hdg:${Number(a.track||0)}deg">${planeMarkup(a)}</span><span class="main"><span class="line"><span class="name">${esc(label(a))}</span><span class="tag">${esc(method(a))}</span></span><span class="meta">${esc(a.registration||a.id.toUpperCase())} · ${esc(a.type||'—')} · ${age(a.seen)}</span></span><span class="kpi num"><b>${altitude(a)}</b><small>${a.gs==null?'—':fmt(a.gs,0)+' kt'}</small></span></button>`).join(''):'<div class="empty">No aircraft in this filter</div>';$$('.row').forEach(el=>el.onclick=()=>selectAircraft(el.dataset.id,true))}
function renderDetail(){const a=aircraft.find(x=>x.id===selected);if(!a){$('#detail').classList.remove('open');return}$('#detail').classList.add('open');$('#detailBody').innerHTML=`<div class="detail-head"><span class="plane-big" style="--hdg:${Number(a.track||0)}deg">${planeMarkup(a)}</span><span class="detail-title"><b>${esc(label(a))}</b><small>${esc(a.registration||a.id.toUpperCase())} · ${esc(a.type||method(a))}</small></span><button id="closeDetail" class="plain close">×</button></div><div class="metric-grid"><div class="metric"><small>Altitude</small><b class="num">${altitude(a)}</b></div><div class="metric"><small>Ground speed</small><b class="num">${a.gs==null?'—':fmt(a.gs,1)+' kt'}</b></div><div class="metric"><small>Track</small><b class="num">${a.track==null?'—':fmt(a.track,1)+'°'}</b></div><div class="metric"><small>Vertical rate</small><b class="num">${a.baroRate==null?'—':(a.baroRate>0?'+':'')+fmt(a.baroRate)+' fpm'}</b></div></div><div class="section"><h3>Identity</h3><div class="kv"><span>ICAO</span><span>${esc(a.id.toUpperCase())}</span><span>Callsign</span><span>${esc(a.callsign||'—')}</span><span>Registration</span><span>${esc(a.registration||'—')}</span><span>Type</span><span>${esc(a.type||'—')}</span><span>Squawk</span><span>${esc(a.squawk||'—')}</span><span>Source</span><span>${esc(method(a))}</span></div></div><div class="section"><h3>Telemetry</h3><div class="kv"><span>Geom altitude</span><span>${a.geom==null?'—':fmt(a.geom)+' ft'}</span><span>Geom rate</span><span>${a.geomRate==null?'—':fmt(a.geomRate)+' fpm'}</span><span>RSSI</span><span>${a.rssi==null?'—':fmt(a.rssi,1)+' dBFS'}</span><span>Messages</span><span>${fmt(a.messages)}</span><span>Seen</span><span>${age(a.seen)}</span><span>Position age</span><span>${age(a.seenPos)}</span></div></div><div class="section"><h3>Position</h3><div class="kv"><span>Latitude</span><span>${a.coord?fmt(a.coord[1],6):'—'}</span><span>Longitude</span><span>${a.coord?fmt(a.coord[0],6):'—'}</span><span>State</span><span>${a.ground?'GROUND':'AIRBORNE'}</span><span>Alert</span><span>${a.alert?'YES':'NO'}</span></div></div>`;$('#closeDetail').onclick=()=>{selected=null;renderList();renderDetail();updateMap()}}
function renderReceiver(){$('#detail').classList.add('open');const v=receiver?.version||'readsb',refresh=receiver?.refresh||1000;$('#detailBody').innerHTML=`<div class="detail-head"><span class="plane-big" style="color:var(--accent)">⌁</span><span class="detail-title"><b>Local receiver</b><small>${esc(v)}</small></span><button id="closeDetail" class="plain close">×</button></div><div class="metric-grid"><div class="metric"><small>Aircraft</small><b>${aircraft.length}</b></div><div class="metric"><small>Message rate</small><b>${fmt(msgRate,0)} /s</b></div><div class="metric"><small>Refresh</small><b>${fmt(refresh)} ms</b></div><div class="metric"><small>AirWire</small><b>v${lastEnvelope?.[0]||1}</b></div></div><div class="section"><h3>Capabilities</h3><div class="kv"><span>readsb</span><span>${receiver?.readsb?'YES':'—'}</span><span>DB server</span><span>${receiver?.dbServer?'YES':'—'}</span><span>binCraft</span><span>${receiver?.binCraft?'YES':'—'}</span><span>zstd</span><span>${receiver?.zstd?'YES':'—'}</span><span>Total messages</span><span>${fmt(lastEnvelope?.[2])}</span></div></div>`;$('#closeDetail').onclick=()=>$('#detail').classList.remove('open')}

const DARK_STYLE={version:8,name:'HPR Dark Minimal',sources:{openmaptiles:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'© OpenStreetMap contributors'}},sprite:'https://tiles.openfreemap.org/sprites/ofm_f384/ofm',glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',layers:[
{id:'background',type:'background',paint:{'background-color':'#1a2433'}},
{id:'water',type:'fill',source:'openmaptiles','source-layer':'water',paint:{'fill-color':'#0a1018'}},
{id:'water-outline',type:'line',source:'openmaptiles','source-layer':'water',paint:{'line-color':'#33445e','line-width':.8,'line-opacity':.9}},
{id:'boundary-state',type:'line',source:'openmaptiles','source-layer':'boundary',filter:['==',['get','admin_level'],4],paint:{'line-color':'#3a4a63','line-width':['interpolate',['linear'],['zoom'],4,.5,10,1],'line-opacity':.55,'line-dasharray':[2,2]}},
{id:'boundary-country',type:'line',source:'openmaptiles','source-layer':'boundary',filter:['==',['get','admin_level'],2],paint:{'line-color':'#4a5d7a','line-width':['interpolate',['linear'],['zoom'],2,.6,8,1.4],'line-opacity':.75}},
{id:'place-city',type:'symbol',source:'openmaptiles','source-layer':'place',minzoom:4,maxzoom:14,filter:['all',['==',['geometry-type'],'Point'],['==',['get','class'],'city']],layout:{'text-field':['coalesce',['get','name_en'],['get','name']],'text-font':['Noto Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],4,9,9,12],'text-transform':'uppercase'},paint:{'text-color':'#879bb8','text-halo-color':'#0a1018','text-halo-width':1.2,'text-opacity':.82}}
]};
const LIGHT_STYLE={version:8,name:'HPR Light Minimal',sources:{openmaptiles:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'© OpenStreetMap contributors'}},sprite:'https://tiles.openfreemap.org/sprites/ofm_f384/ofm',glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',layers:[
{id:'background',type:'background',paint:{'background-color':'#f4f1ea'}},
{id:'water',type:'fill',source:'openmaptiles','source-layer':'water',paint:{'fill-color':'#b2d7df'}},
{id:'water-outline',type:'line',source:'openmaptiles','source-layer':'water',paint:{'line-color':'#8fbcc8','line-width':.8,'line-opacity':.9}},
{id:'boundary-state',type:'line',source:'openmaptiles','source-layer':'boundary',filter:['==',['get','admin_level'],4],paint:{'line-color':'#c4b89a','line-width':['interpolate',['linear'],['zoom'],4,.5,10,1],'line-opacity':.55,'line-dasharray':[2,2]}},
{id:'boundary-country',type:'line',source:'openmaptiles','source-layer':'boundary',filter:['==',['get','admin_level'],2],paint:{'line-color':'#a89878','line-width':['interpolate',['linear'],['zoom'],2,.6,8,1.4],'line-opacity':.75}},
{id:'place-city',type:'symbol',source:'openmaptiles','source-layer':'place',minzoom:4,maxzoom:14,filter:['all',['==',['geometry-type'],'Point'],['==',['get','class'],'city']],layout:{'text-field':['coalesce',['get','name_en'],['get','name']],'text-font':['Noto Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],4,9,9,12],'text-transform':'uppercase'},paint:{'text-color':'#3a5160','text-halo-color':'#fff','text-halo-width':1.2,'text-opacity':.82}}
]};

function fc(){return{type:'FeatureCollection',features:aircraft.filter(a=>a.coord).map(a=>({type:'Feature',id:a.id,geometry:{type:'Point',coordinates:a.coord},properties:{id:a.id,label:label(a),track:Number(a.track||0),icon:aircraftShape(a),selected:a.id===selected?1:0,status:a.status,ground:a.ground?1:0,mlat:a.mlat?1:0,altitude:a.ground?'GND':(a.baro==null?'':String(Math.round(Number(a.baro)/100)*100))}}))}}
function imageDataUrl(svg){return'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function addSvgImage(name,svg){return new Promise(resolve=>{if(map.hasImage(name)){resolve();return}const img=new Image();img.onload=()=>{try{if(!map.hasImage(name))map.addImage(name,img,{pixelRatio:2})}catch(_){}resolve()};img.onerror=resolve;img.src=imageDataUrl(svg)})}
async function installLayers(){
  if(!map)return;mapReady=false;
  const airColor=document.documentElement.dataset.theme==='dark'?'#f1ca58':'#8a5a00';
  await Promise.all(Object.keys(AIRCRAFT_SHAPES).map(k=>addSvgImage('aircraft-'+k,aircraftSvg(k,airColor))));
  if(map.getSource('aircraft'))return;
  map.addSource('aircraft',{type:'geojson',data:fc()});
  map.addLayer({id:'aircraft-halo',type:'circle',source:'aircraft',paint:{'circle-radius':['case',['==',['get','selected'],1],13,8],'circle-color':'transparent','circle-stroke-width':['case',['==',['get','selected'],1],2,1],'circle-stroke-color':['case',['==',['get','selected'],1],'#59ddff',['match',['get','status'],'live','#42dfa3','aging','#ffb84d','#70869c']],'circle-opacity':.85}});
  map.addLayer({id:'aircraft-symbol',type:'symbol',source:'aircraft',layout:{'icon-image':['concat','aircraft-',['get','icon']],'icon-size':['interpolate',['linear'],['zoom'],5,.56,8,.72,12,.96],'icon-rotate':['get','track'],'icon-rotation-alignment':'map','icon-allow-overlap':true}});
  map.addLayer({id:'aircraft-label',type:'symbol',source:'aircraft',minzoom:6.2,layout:{'text-field':['format',['get','label'],{'font-scale':1},'\n',{},['get','altitude'],{'font-scale':.78}],'text-font':['Noto Sans Regular'],'text-size':10,'text-offset':[0,2.35],'text-optional':true,'text-allow-overlap':false},paint:{'text-color':document.documentElement.dataset.theme==='dark'?'#dbe6f4':'#243746','text-halo-color':document.documentElement.dataset.theme==='dark'?'#071018':'#fff','text-halo-width':1.2}});
  map.addLayer({id:'aircraft-hit',type:'circle',source:'aircraft',paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,12,10,18],'circle-color':'#000','circle-opacity':.01}});
  map.on('click','aircraft-hit',e=>{const id=e.features?.[0]?.properties?.id;if(id)selectAircraft(String(id),false)});
  map.on('mouseenter','aircraft-hit',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','aircraft-hit',()=>map.getCanvas().style.cursor='');
  mapReady=true;updateMap();if(firstFit&&aircraft.some(a=>a.coord)){firstFit=false;fitAll()}
}
function updateMap(){if(!mapReady)return;const src=map.getSource('aircraft');if(src)src.setData(fc())}
function fitAll(){if(!mapReady)return;const pts=aircraft.filter(a=>a.coord);if(!pts.length)return;const b=new maplibregl.LngLatBounds();pts.forEach(a=>b.extend(a.coord));map.fitBounds(b,{padding:{top:70,bottom:70,left:390,right:390},maxZoom:8,duration:450})}
function selectAircraft(id,fly){selected=id;renderList();renderDetail();updateMap();const a=aircraft.find(x=>x.id===id);if(fly&&a?.coord)map.flyTo({center:a.coord,zoom:Math.max(map.getZoom(),7),duration:450})}
function setConnected(ok){const el=$('#connection');el.classList.toggle('offline',!ok);el.querySelector('span').textContent=ok?`LIVE · ${aircraft.length}`:'AirWire offline'}
async function loadReceiver(){try{const r=await fetch('/api/readsb/receiver.json',{cache:'no-store'});if(r.ok)receiver=await r.json()}catch(_){}}
async function tick(){if(polling)return;polling=true;try{const r=await fetch('/api/air/v1',{cache:'no-store'});if(!r.ok)throw Error(r.status);const env=await r.json();if(!Array.isArray(env)||env[0]!==1||!Array.isArray(env[3]))throw Error('bad AirWire');lastEnvelope=env;aircraft=env[3].map(decode);lastGood=Date.now();setConnected(true);const now=Date.now(),count=Number(env[2]||0);if(lastCount!=null&&count>=lastCount)msgRate=(count-lastCount)/Math.max((now-lastCountTs)/1000,.001);lastCount=count;lastCountTs=now;renderChips();renderList();if(selected)renderDetail();updateMap();if(firstFit&&mapReady&&aircraft.some(a=>a.coord)){firstFit=false;fitAll()}}catch(_){if(Date.now()-lastGood>3500)setConnected(false)}finally{polling=false}}
function applyThemeStyle(){styleGeneration++;mapReady=false;map.setStyle(document.documentElement.dataset.theme==='dark'?DARK_STYLE:LIGHT_STYLE);map.once('style.load',()=>installLayers())}
function initMap(){map=new maplibregl.Map({container:'map',style:document.documentElement.dataset.theme==='dark'?DARK_STYLE:LIGHT_STYLE,center:[106.3,20.7],zoom:6.3,attributionControl:false});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');map.on('load',()=>installLayers())}

$('#search').oninput=()=>renderList();$('#airBtn').onclick=()=>{$('#collection').classList.toggle('open');$('#airBtn').classList.toggle('on',$('#collection').classList.contains('open'))};$('#receiverBtn').onclick=()=>renderReceiver();$('#fitBtn').onclick=fitAll;$('#closeList').onclick=()=>{$('#collection').classList.remove('open');$('#airBtn').classList.remove('on')};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;renderList()});
$('#themeBtn').onclick=()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';applyThemeStyle()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;$('#detail').classList.remove('open');renderList();updateMap()}});
initMap();loadReceiver();tick();setInterval(tick,1000);setInterval(loadReceiver,30000);
})();
</script>
