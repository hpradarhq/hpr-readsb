<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HPRadar Atlas Edge</title>
  <style>
    html,body,#atlas{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#02070d}
    #atlas{display:block}
  </style>
</head>
<body>
  <iframe id="atlas" src="atlas-v4.7-shell.html" title="HPRadar Atlas Edge" allow="fullscreen" referrerpolicy="same-origin"></iframe>
  <script>
    (()=>{
      'use strict';
      const frame=document.getElementById('atlas');
      const scripts=['airwire-adapter.js','aircraft-renderer.js','station-context.js','atlas-edge-live-bridge.js'];
      const inject=(doc,src)=>new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error(`failed to load ${src}`));doc.body.appendChild(s)});
      frame.addEventListener('load',async()=>{
        const doc=frame.contentDocument;
        try{for(const src of scripts)await inject(doc,src)}catch(error){console.error('Atlas Edge bridge bootstrap failed',error)}
      },{once:true});
    })();
  </script>
</body>
</html>
