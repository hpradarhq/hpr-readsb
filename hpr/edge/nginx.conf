user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 80 default_server;
        root /usr/share/nginx/html;
        index index.html;

        location = /ws/air {
            proxy_pass http://127.0.0.1:30154/ws/air;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 10s;
        }

        location = /api/air/v1 {
            alias /run/readsb/airwire.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location = /data/stats.json {
            alias /run/readsb/stats.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Lazy aircraft photo lookup. Only detail view calls this endpoint.
        location /api/photo/hex/ {
            proxy_ssl_server_name on;
            proxy_ssl_name api.planespotters.net;
            proxy_set_header Host api.planespotters.net;
            proxy_set_header User-Agent "HPRadar-Edge/1.0";
            proxy_set_header Accept "application/json";
            proxy_pass https://api.planespotters.net/pub/photos/hex/;
            proxy_connect_timeout 4s;
            proxy_read_timeout 6s;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # readsb writes trace_recent/trace_full as gzip content without a .gz suffix.
        # Keep the same HTTP semantics used by tar1090; browser fetch decodes it.
        location /data/traces/ {
            alias /run/readsb/traces/;
            gzip_static off;

            location ~ trace_recent {
                gzip off;
                default_type application/json;
                add_header Cache-Control "no-cache" always;
                add_header Content-Encoding "gzip" always;
            }

            location ~ trace_full {
                gzip off;
                default_type application/json;
                add_header Cache-Control "no-cache" always;
                add_header Content-Encoding "gzip" always;
            }
        }

        location /api/readsb/ {
            alias /run/readsb/;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
