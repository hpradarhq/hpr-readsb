services:
  hpr-edge:
    image: ghcr.io/hpradarhq/hpr-readsb-edge:edge
    container_name: hpr-edge
    hostname: "${FEEDER_NAME:-hpr-edge}"
    restart: unless-stopped
    pull_policy: always

    env_file:
      - .env

    environment:
      READSB_GAIN: "${READSB_GAIN:-auto}"
      READSB_JSON_INTERVAL: "${READSB_JSON_INTERVAL:-1}"

    ports:
      - "8080:80"      # Atlas Edge UI + /api/air/v1
      - "30002:30002"  # raw Mode-S
      - "30003:30003"  # SBS
      - "30004:30004"  # BeastReduce
      - "30005:30005"  # Beast

    volumes:
      - /dev/bus/usb:/dev/bus/usb

    device_cgroup_rules:
      - "c 189:* rwm"

    tmpfs:
      - /run/readsb:size=32m,mode=0755
